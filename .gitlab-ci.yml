# ========================================
# EMS Platform - CI/CD Pipeline
# ========================================

stages:
  - setup  # Dependency installation & caching
  - quality  # Code quality checks (ESLint, Prettier)
  - security  # Security audits & vulnerability scanning
  - test  # Unit & integration tests with coverage
  - analysis  # SonarQube code analysis
  - build  # Docker image building
  - image_scan  # Container security scanning
  - infrastructure  # Kubernetes manifest validation
  - gitops  # Deployment to K8s cluster

# ========================================
# Global Variables
# ========================================
variables:
  # Git Configuration
  GIT_CLEAN_FLAGS: -ffdx -e client/node_modules/ -e backend/node_modules/
  GIT_DEPTH: "0"

  # Docker Configuration
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"

  # Node.js Configuration
  NODE_VERSION: "20"
  NODE_ENV: "ci"
  NPM_CONFIG_PREFER_OFFLINE: "true"
  NPM_CONFIG_AUDIT: "false"
  NEXT_TELEMETRY_DISABLED: "1"

  # Database Configuration
  POSTGRES_VERSION: "15"

  # Docker Image Configuration
  FRONTEND_IMAGE: "amineelalami/ems-platform-frontend"
  BACKEND_IMAGE: "amineelalami/ems-platform-backend"
  DB_IMAGE: "amineelalami/ems-platform-db"
  COMMIT_TAG: "sha-${CI_COMMIT_SHORT_SHA}"
  LATEST_TAG: "latest"

  # Testing Configuration
  COVERAGE_THRESHOLD: "80"
  TEST_TIMEOUT: "10000"
  CI: "true"

  # SonarQube Configuration
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  SONAR_HOST_URL: "http://172.17.0.1:9000"

# ========================================
# Reusable Templates
# ========================================

# Template: Docker Environment
.docker_template: &docker_template
  image: docker:24
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  before_script:
    - echo "🔧 Docker Environment Setup"
    - docker --version
    - docker info
    - echo "📦 Authenticating with Docker Hub..."
    - >-
      echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME"
      --password-stdin
  tags:
    - linux
    - docker
    - ems-platform

# Template: Node.js Environment
.node_template: &node_template
  image: node:${NODE_VERSION}
  before_script:
    - echo "🔧 Node.js Environment Setup"
    - node --version
    - npm --version
  tags:
    - linux
    - docker
    - ems-platform

# Template: Node.js + PostgreSQL Environment
.node_postgres_template: &node_postgres_template
  image: node:${NODE_VERSION}
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_USER: "amine"
        POSTGRES_DB: "emsdb"
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  variables:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    FF_NETWORK_PER_BUILD: "true"
    DATABASE_URL: "postgresql://amine:${POSTGRES_PASSWORD}@postgres:5432/emsdb?schema=public"
  before_script:
    - apt-get update > /dev/null && apt-get install -y postgresql-client > /dev/null
    - |
      echo "🔄 Waiting for PostgreSQL (${POSTGRES_USER}) to be ready..."
      counter=0
      until pg_isready -h postgres -U "${POSTGRES_USER}" || [ $counter -eq 30 ]; do
        sleep 2
        counter=$((counter + 1))
        echo "⏳ Attempt $counter/30..."
      done
  tags:
    - linux
    - docker
    - ems-platform

# Template: Alpine Linux Environment
.alpine_template: &alpine_template
  image: alpine:latest
  before_script:
    - echo "🔧 Alpine Linux Setup"
    - apk add --no-cache openssh-client curl postgresql-client bc
  tags:
    - linux
    - docker
    - ems-platform

# Template: SonarQube Scanner
.sonarqube_template: &sonarqube_template
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  cache:
    key: "sonar-${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  before_script:
    - echo "🔧 SonarQube Scanner Setup"
    - sonar-scanner --version
  tags:
    - linux
    - docker
    - ems-platform

# Template: Trivy Security Scanner
.trivy_template: &trivy_template
  image: alpine:latest
  before_script:
    - echo "🔧 Installing Trivy Security Scanner..."
    - apk add --no-cache curl
    - >-
      curl -sfL
      https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh
      | sh -s -- -b /usr/local/bin
    - echo "✅ Trivy installed successfully"
    - trivy --version
  tags:
    - linux
    - docker
    - ems-platform

# ========================================
# STAGE 1: SETUP
# Install and cache dependencies
# ========================================

install_frontend_deps:
  stage: setup
  <<: *node_template
  script:
    - |
      echo "📦 Installing Frontend Dependencies..."
      cd client

      echo "🔍 Project Structure:"
      ls -la

      echo "🗑️ Cleaning npm cache..."
      npm cache clean --force

      echo "📥 Installing dependencies..."
      npm install --no-audit --no-fund --loglevel=verbose

      echo "✅ Frontend dependencies installed successfully"

      echo "📊 Dependency Size:"
      du -sh node_modules || echo "Could not calculate size"
  cache:
    key: "frontend-npm-${CI_COMMIT_REF_SLUG}"
    paths:
      - client/node_modules/
    policy: pull-push
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 20 minutes
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

install_backend_deps:
  stage: setup
  <<: *node_template
  script:
    - |
      echo "📦 Installing Backend Dependencies..."
      cd backend

      echo "🔍 Project Structure:"
      ls -la

      echo "🔍 Checking for cached dependencies..."
      if [ -d "node_modules" ]; then
        echo "🔄 Cache found! Using npm ci for faster installation..."
        npm ci --prefer-offline --no-audit
        echo "✅ Dependencies restored from cache"
      else
        echo "📥 No cache found. Performing full installation..."
        npm install --prefer-offline --no-audit --no-fund
        echo "✅ Dependencies installed successfully"
      fi

      echo "🔍 Verifying Prisma installation..."
      npx prisma@6.18.0 --version

      echo "🗄️ Generating Prisma Client..."
      npx prisma@6.18.0 generate --no-hints

      echo "📊 Dependency Size:"
      du -sh node_modules || echo "Could not calculate size"
  cache:
    key: "backend-npm-${CI_COMMIT_REF_SLUG}"
    paths:
      - backend/node_modules/
      - backend/node_modules/.prisma/
      - backend/node_modules/@prisma/
    policy: pull-push
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 20 minutes
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ========================================
# STAGE 2: QUALITY
# Code quality checks and linting
# ========================================

eslint_frontend:
  stage: quality
  <<: *node_template
  dependencies:
    - install_frontend_deps
  script:
    - |
      echo "📝 Running ESLint on Frontend..."
      cd client

      # Create artifacts directory
      mkdir -p artifacts

      # Run ESLint with JSON output for reporting
      echo "🔍 Analyzing code quality..."
      npx eslint src/ \
        --format json \
        --output-file artifacts/eslint-frontend.json || true

      # Display results summary
      echo "📊 ESLint Results:"
      if [ -f "artifacts/eslint-frontend.json" ]; then
        echo "Report generated successfully"
      fi

      echo "✅ ESLint analysis completed"
  artifacts:
    paths:
      - client/artifacts/eslint-frontend.json
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

eslint_backend:
  stage: quality
  <<: *node_template
  dependencies:
    - install_backend_deps
  script:
    - |
      echo "📝 Running ESLint on Backend..."
      cd backend

      # Create artifacts directory
      mkdir -p artifacts

      # Run ESLint with JSON output for reporting
      echo "🔍 Analyzing code quality..."
      npx eslint . \
        --ext .js,.ts \
        --format json \
        --output-file artifacts/eslint-backend.json || true

      # Display results summary
      echo "📊 ESLint Results:"
      if [ -f "artifacts/eslint-backend.json" ]; then
        echo "Report generated successfully"
      fi

      echo "✅ ESLint analysis completed"
  artifacts:
    paths:
      - backend/artifacts/eslint-backend.json
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

prettier_check:
  stage: quality
  <<: *node_template
  dependencies:
    - install_frontend_deps
    - install_backend_deps
  script:
    - |
      echo "🎨 Running Prettier Formatting Check..."

      # Check Frontend formatting
      echo "📁 Checking Frontend formatting..."
      cd client
      npx prettier --check src/ || frontend_failed=true
      cd ..

      # Check Backend formatting
      echo "📁 Checking Backend formatting..."
      cd backend
      npx prettier --check . || backend_failed=true

      # Summary
      if [ "$frontend_failed" = true ] || [ "$backend_failed" = true ]; then
        echo "⚠️ Formatting issues detected. Run 'prettier --write' to fix."
      else
        echo "✅ All files are properly formatted"
      fi
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

# ========================================
# STAGE 3: SECURITY
# Security audits and vulnerability scanning
# ========================================

audit_frontend:
  stage: security
  <<: *node_template
  dependencies:
    - install_frontend_deps
  script:
    - |
      echo "🔒 Running Frontend Security Audit..."
      cd client

      # Create artifacts directory
      mkdir -p artifacts

      # Run npm audit for high-severity vulnerabilities
      echo "🔍 Scanning for vulnerabilities..."
      npm audit --audit-level high --production --json > artifacts/audit-frontend.json || true

      # Display summary
      echo "📊 Audit Summary:"
      if [ -f "artifacts/audit-frontend.json" ]; then
        echo "Security report generated"
      fi

      echo "✅ Frontend security audit completed"
  artifacts:
    paths:
      - client/artifacts/audit-frontend.json
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

audit_backend:
  stage: security
  <<: *node_template
  dependencies:
    - install_backend_deps
  script:
    - |
      echo "🔒 Running Backend Security Audit..."
      cd backend

      # Create artifacts directory
      mkdir -p artifacts

      # Run npm audit for high-severity vulnerabilities
      echo "🔍 Scanning for vulnerabilities..."
      npm audit --audit-level high --production --json > artifacts/audit-backend.json || true

      # Display summary
      echo "📊 Audit Summary:"
      if [ -f "artifacts/audit-backend.json" ]; then
        echo "Security report generated"
      fi

      echo "✅ Backend security audit completed"
  artifacts:
    paths:
      - backend/artifacts/audit-backend.json
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

validate_prisma_schema:
  stage: security
  <<: *node_postgres_template
  # dependencies:
  #   - install_backend_deps
  script:
    - |
      echo "🗄️ Validating Prisma Schema..."
      cd backend
      npm install @prisma/client prisma --quiet
      echo "🔍 Validating schema syntax..."
      npx prisma validate
      echo "🔍 Testing database connection..."
      npx prisma db execute --stdin --url "$DATABASE_URL" <<< "SELECT version();"
      echo "✅ Database connection verified"
      echo "✅ Prisma schema validation successful"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 15 minutes
  allow_failure: false

trivy_filesystem_scan:
  stage: security
  <<: *trivy_template
  script:
    - |
      echo "🔍 Running Trivy Filesystem Security Scan..."
      mkdir -p artifacts

      # Scan filesystem for vulnerabilities
      echo "📂 Scanning project files..."
      trivy filesystem . \
        --format json \
        --output artifacts/trivy-fs-scan.json || true

      trivy filesystem . \
        --format table \
        --output artifacts/trivy-fs-scan.txt || true

      echo "✅ Trivy filesystem scan completed"
  artifacts:
    paths:
      - artifacts/trivy-fs-scan.json
      - artifacts/trivy-fs-scan.txt
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

# ========================================
# STAGE 4: TEST
# Unit and integration tests with coverage
# ========================================

test_backend:
  stage: test
  <<: *node_postgres_template
  dependencies:
    - install_backend_deps
  script:
    - |
      echo "🧪 Running Backend Tests with Coverage..."
      cd backend

      # Ensure Prisma Client is generated
      echo "🗄️ Generating Prisma Client..."
      npx prisma@6.18.0 generate --no-hints

      # Run database migrations
      echo "🔄 Running database migrations..."
      npx prisma@6.18.0 migrate deploy

      # Create output directories
      mkdir -p test-results
      mkdir -p coverage

      # Run tests with coverage
      echo "📊 Executing test suite..."
      npm run test -- \
        --coverage \
        --coverageDirectory=coverage \
        --coverageReporters=cobertura \
        --coverageReporters=html \
        --coverageReporters=text \
        --coverageReporters=lcov \
        --passWithNoTests || true

      # Display coverage summary
      echo "📈 Test Coverage Summary:"
      if [ -f "coverage/coverage-summary.json" ]; then
        cat coverage/coverage-summary.json | grep -A 4 '"total"' || true
      fi

      echo "✅ Backend tests completed"
  artifacts:
    paths:
      - backend/coverage/
      - backend/test-results/
    reports:
      junit: backend/test-results/*.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage/cobertura-coverage.xml
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: false
  timeout: 15 minutes
  retry:
    max: 1
    when:
      - runner_system_failure

test_frontend:
  stage: test
  <<: *node_template
  dependencies:
    - install_frontend_deps
  script:
    - |
      echo "🧪 Running Frontend Tests with Coverage..."
      cd client

      # Create output directories
      mkdir -p test-results
      mkdir -p coverage

      # Run Jest tests with coverage
      echo "📊 Executing test suite..."
      ./node_modules/.bin/jest \
        --runInBand \
        --watchAll=false \
        --passWithNoTests \
        --silent \
        --coverage \
        --coverageDirectory=coverage \
        --collectCoverageFrom='["src/**/*.{js,jsx,ts,tsx}",
        "!src/**/*.d.ts"]' \
        --coverageReporters=cobertura \
        --coverageReporters=html \
        --coverageReporters=text \
        --coverageReporters=lcov

      # Display coverage summary
      echo "📈 Test Coverage Summary:"
      if [ -f "coverage/coverage-summary.json" ]; then
        cat coverage/coverage-summary.json | grep -A 4 '"total"'
      fi

      echo "✅ Frontend tests completed successfully"
  artifacts:
    paths:
      - client/coverage/
      - client/test-results/
    reports:
      junit: client/test-results/*.xml
      coverage_report:
        coverage_format: cobertura
        path: client/coverage/cobertura-coverage.xml
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: false
  timeout: 15 minutes
  retry:
    max: 1
    when:
      - runner_system_failure

# ========================================
# STAGE 5: ANALYSIS
# SonarQube code quality analysis
# ========================================

sonarqube_frontend:
  stage: analysis
  <<: *sonarqube_template
  dependencies:
    - install_frontend_deps
    - test_frontend
  script:
    - |
      echo "📊 SonarQube Analysis - Frontend"

      # Verify SONAR_TOKEN is set
      if [ -z "${SONAR_TOKEN:-}" ]; then
        echo "❌ ERROR: SONAR_TOKEN is not defined!"
        echo "Please configure SONAR_TOKEN in your GitLab Runner"
        exit 1
      fi

      echo "✅ Configuration validated"
      echo "🔗 SonarQube Server: $SONAR_HOST_URL"

      # Run SonarQube analysis
      cd client

      sonar-scanner \
        -Dsonar.projectKey=ems-platform-frontend \
        -Dsonar.projectName="EMS Platform - Frontend" \
        -Dsonar.projectVersion=${CI_COMMIT_SHORT_SHA} \
        -Dsonar.sources=app,components,hooks,lib,styles \
        -Dsonar.exclusions=**/node_modules/**,**/.next/**,
        **/coverage/** \
        -Dsonar.host.url=${SONAR_HOST_URL} \
        -Dsonar.login=${SONAR_TOKEN} \
        -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
        -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info \
        -Dsonar.qualitygate.wait=false

      echo "✅ Frontend analysis completed"
      echo "📈 View report: ${SONAR_HOST_URL}/dashboard?id=ems-platform-frontend"
  artifacts:
    paths:
      - client/.scannerwork/
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

sonarqube_backend:
  stage: analysis
  <<: *sonarqube_template
  dependencies:
    - install_backend_deps
    - test_backend
  script:
    - |
      echo "📊 SonarQube Analysis - Backend"

      # Verify SONAR_TOKEN is set
      if [ -z "${SONAR_TOKEN:-}" ]; then
        echo "❌ ERROR: SONAR_TOKEN is not defined!"
        exit 1
      fi

      echo "✅ Configuration validated"
      echo "🔗 SonarQube Server: $SONAR_HOST_URL"

      # Run SonarQube analysis
      cd backend

      sonar-scanner \
        -Dsonar.projectKey=ems-platform-backend \
        -Dsonar.projectName="EMS Platform - Backend" \
        -Dsonar.projectVersion=${CI_COMMIT_SHORT_SHA} \
        -Dsonar.sources=. \
        -Dsonar.exclusions=**/node_modules/**,**/coverage/**,
        **/*.test.js,**/*.spec.js \
        -Dsonar.host.url=${SONAR_HOST_URL} \
        -Dsonar.login=${SONAR_TOKEN} \
        -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
        -Dsonar.coverage.exclusions=**/*.test.js,**/*.spec.js,
        **/node_modules/** \
        -Dsonar.qualitygate.wait=false \
        -Dsonar.scm.provider=git

      echo "✅ Backend analysis completed"
      echo "📈 View report: ${SONAR_HOST_URL}/dashboard?id=ems-platform-backend"
  artifacts:
    paths:
      - backend/.scannerwork/
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

# ========================================
# STAGE 6: BUILD
# Docker image building
# ========================================

build_frontend_image:
  stage: build
  <<: *docker_template
  dependencies:
    - test_frontend
  script:
    - |
      echo "🏗️ Building Frontend Docker Image..."

      # Build image with multiple tags
      docker build \
        -t $FRONTEND_IMAGE:$COMMIT_TAG \
        -t $FRONTEND_IMAGE:latest \
        ./client

      # Display built images
      echo "🔍 Built Images:"
      docker images | grep "$FRONTEND_IMAGE"

      echo "✅ Frontend image built successfully"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 20 minutes
  retry:
    max: 1
    when:
      - runner_system_failure

build_backend_image:
  stage: build
  <<: *docker_template
  dependencies:
    - test_backend
  script:
    - |
      echo "🏗️ Building Backend Docker Image..."

      # Build image with multiple tags
      docker build \
        -t $BACKEND_IMAGE:$COMMIT_TAG \
        -t $BACKEND_IMAGE:latest \
        ./backend

      # Display built images
      echo "🔍 Built Images:"
      docker images | grep "$BACKEND_IMAGE"

      echo "✅ Backend image built successfully"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 15 minutes
  retry:
    max: 1
    when:
      - runner_system_failure

build_db_image:
  stage: build
  <<: *docker_template
  script:
    - |
      echo "🏗️ Building Database Docker Image..."

      # Verify build context
      echo "📂 Verifying build context..."
      pwd
      ls -la

      # Check if db directory exists
      if [ ! -d "db" ]; then
        echo "❌ ERROR: 'db' directory not found!"
        exit 1
      fi

      cd db
      echo "📂 Database Directory Contents:"
      ls -la

      # Verify schema.sql exists (should be version-controlled)
      if [ ! -f "schema.sql" ]; then
        echo "❌ ERROR: schema.sql not found in db/"
        echo "This file must be version-controlled"
        exit 1
      fi

      # Handle confidential data
      echo "🔒 Managing Confidential Data..."
      if [ "$CI_COMMIT_REF_NAME" = "main" ] &&
        [ -f "${EMPLOYEEDB_DUMP_FILE}" ]; then
        echo "📦 Using confidential dump for production..."
        cp "${EMPLOYEEDB_DUMP_FILE}" employeedb_dump.sql
        echo "✅ Confidential data copied ($(wc -l < employeedb_dump.sql) lines)"
      elif [ "$CI_COMMIT_REF_NAME" = "dev" ]; then
        echo "🛠️ Development mode: Creating test data..."
        cat > employeedb_dump.sql << 'EOF'
      -- Development test data for EMS Platform
      -- This is NOT the real confidential data
      -- Real data is only used in production builds

      -- Test data initialization
      SELECT 'Development database initialized with test data' AS status;

      -- Add minimal test data
      INSERT INTO users (email, name) VALUES
        ('test@example.com', 'Test User'),
        ('dev@example.com', 'Development User')
      ON CONFLICT DO NOTHING;
      EOF
        echo "✅ Test data created for development"
      else
        echo "⚠️ No data file provided, empty database"
        echo "" > employeedb_dump.sql
      fi

      # Return to parent directory for build
      cd ..

      # Build Docker image
      echo "🔨 Building Docker image..."
      docker build \
        -t $DB_IMAGE:$COMMIT_TAG \
        -t $DB_IMAGE:latest \
        ./db

      # Display built images
      echo "🔍 Built Images:"
      docker images | grep "$DB_IMAGE"

      echo "✅ Database image built successfully"

      # Cleanup temporary file
      if [ -f "db/employeedb_dump.sql" ]; then
        rm db/employeedb_dump.sql
        echo "🧹 Temporary file cleaned"
      fi
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 10 minutes

# ========================================
# STAGE 7: IMAGE_SCAN
# Container security vulnerability scanning
# ========================================

trivy_scan_frontend:
  stage: image_scan
  <<: *trivy_template
  dependencies:
    - build_frontend_image
  script:
    - |
      echo "🔍 Scanning Frontend Image with Trivy..."
      mkdir -p artifacts

      # Scan container image for vulnerabilities
      echo "🔒 Running security scan..."
      trivy image \
        --format json \
        --output artifacts/trivy-frontend-scan.json \
        $FRONTEND_IMAGE:$COMMIT_TAG || true

      trivy image \
        --format table \
        --output artifacts/trivy-frontend-scan.txt \
        $FRONTEND_IMAGE:$COMMIT_TAG || true

      echo "✅ Frontend image scan completed"
  artifacts:
    paths:
      - artifacts/trivy-frontend-scan.json
      - artifacts/trivy-frontend-scan.txt
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

trivy_scan_backend:
  stage: image_scan
  <<: *trivy_template
  dependencies:
    - build_backend_image
  script:
    - |
      echo "🔍 Scanning Backend Image with Trivy..."
      mkdir -p artifacts

      # Scan container image for vulnerabilities
      echo "🔒 Running security scan..."
      trivy image \
        --format json \
        --output artifacts/trivy-backend-scan.json \
        $BACKEND_IMAGE:$COMMIT_TAG || true

      trivy image \
        --format table \
        --output artifacts/trivy-backend-scan.txt \
        $BACKEND_IMAGE:$COMMIT_TAG || true

      echo "✅ Backend image scan completed"
  artifacts:
    paths:
      - artifacts/trivy-backend-scan.json
      - artifacts/trivy-backend-scan.txt
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

trivy_scan_db:
  stage: image_scan
  <<: *trivy_template
  dependencies:
    - build_db_image
  script:
    - |
      echo "🔍 Scanning Database Image with Trivy..."
      mkdir -p artifacts

      # Scan container image for vulnerabilities
      echo "🔒 Running security scan..."
      trivy image \
        --format json \
        --output artifacts/trivy-db-scan.json \
        $DB_IMAGE:$COMMIT_TAG || true

      trivy image \
        --format table \
        --output artifacts/trivy-db-scan.txt \
        $DB_IMAGE:$COMMIT_TAG || true

      echo "✅ Database image scan completed"
  artifacts:
    paths:
      - artifacts/trivy-db-scan.json
      - artifacts/trivy-db-scan.txt
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

# ========================================
# STAGE 8: INFRASTRUCTURE
# Kubernetes manifest validation
# ========================================

kube_linter:
  stage: infrastructure
  image: alpine:latest
  before_script:
    - echo "🔧 Installing kube-linter..."
    - apk add --no-cache curl tar
    - >-
      curl -L
      https://github.com/stackrox/kube-linter/releases/download/v0.6.8/kube-linter-linux.tar.gz
      -o kube-linter.tar.gz
    - tar -xzf kube-linter.tar.gz
    - chmod +x kube-linter
    - mv kube-linter /usr/local/bin/
    - kube-linter version
  script:
    - |
      echo "🔍 Running kube-linter (Best Practices & Security)..."
      mkdir -p artifacts

      # Run kube-linter analysis
      echo "📋 Analyzing Kubernetes manifests..."
      kube-linter lint k8s/ --format sarif >
        artifacts/kube-linter-report.sarif || true

      kube-linter lint k8s/ \
        --format plain || true

      echo "✅ kube-linter analysis completed"
  artifacts:
    paths:
      - artifacts/kube-linter-report.sarif
    expire_in: 1 week
    when: always
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  tags:
    - linux
    - docker
    - ems-platform

kubeconform_validate:
  stage: infrastructure
  image: alpine:latest
  before_script:
    - echo "🔧 Installing kubeconform..."
    - apk add --no-cache curl tar
    - >-
      curl -L
      https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
      -o kubeconform.tar.gz
    - tar -xzf kubeconform.tar.gz
    - chmod +x kubeconform
    - mv kubeconform /usr/local/bin/
  script:
    - |
      echo "🔍 Validating Against Official Kubernetes Schema..."

      # Run kubeconform validation
      kubeconform \
        -schema-location default \
        -ignore-missing-schemas \
        -summary \
        k8s/ || true

      echo "✅ kubeconform validation completed"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true
  tags:
    - linux
    - docker
    - ems-platform

# ========================================
# STAGE 9: GITOPS
# Push images & update manifests
# ========================================

push_images:
  stage: gitops
  <<: *docker_template
  needs:
    - build_frontend_image
    - build_backend_image
    - build_db_image
  script:
    - |
      echo "📤 Pushing Docker Images to Docker Hub..."
      
      # Push Frontend Image
      echo "🔄 Pushing Frontend image..."
      docker push $FRONTEND_IMAGE:$COMMIT_TAG
      docker push $FRONTEND_IMAGE:latest
      echo "✅ Frontend image pushed"
      
      # Push Backend Image
      echo "🔄 Pushing Backend image..."
      docker push $BACKEND_IMAGE:$COMMIT_TAG
      docker push $BACKEND_IMAGE:latest
      echo "✅ Backend image pushed"
      
      # Push Database Image
      echo "🔄 Pushing Database image..."
      docker push $DB_IMAGE:$COMMIT_TAG
      docker push $DB_IMAGE:latest
      echo "✅ Database image pushed"
      
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "✅ All images pushed successfully!"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "📦 Images pushed:"
      echo "  • $FRONTEND_IMAGE:$COMMIT_TAG"
      echo "  • $FRONTEND_IMAGE:latest"
      echo "  • $BACKEND_IMAGE:$COMMIT_TAG"
      echo "  • $BACKEND_IMAGE:latest"
      echo "  • $DB_IMAGE:$COMMIT_TAG"
      echo "  • $DB_IMAGE:latest"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 15 minutes
  tags:
    - linux
    - docker
    - ems-platform

update_manifests:
  stage: gitops
  image: alpine:latest

  needs:
    - push_images

  before_script:
    - echo "🔧 Setting up GitOps environment..."
    - apk add --no-cache git openssh-client bash wget
    - >-
      wget
      https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64
      -O /usr/bin/yq
    - chmod +x /usr/bin/yq
    - yq --version
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$GITOPS_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -t rsa gitlab.com >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - git config --global user.email "ci@ems-platform.com"
    - git config --global user.name "GitLab CI Bot"
    - >-
      git config --global core.sshCommand
      "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no"

  script:
    - |
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "🔄 GITOPS: Updating Kubernetes Manifests"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        OVERLAY="prod"
        IMAGE_TAG="latest"
        echo "🚀 Environment: PRODUCTION"
      else
        OVERLAY="dev"
        IMAGE_TAG="$COMMIT_TAG"
        echo "🛠️  Environment: DEVELOPMENT"
      fi

      echo "📦 Image Tag: $IMAGE_TAG"
      echo "🌿 Git Branch: $CI_COMMIT_REF_NAME"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      echo ""
      echo "📥 Cloning GitOps repository..."
      git clone git@gitlab.com:amineelalami05/ems-gitops.git
      cd ems-gitops

      KUSTOMIZE_FILE="k8s/overlays/$OVERLAY/kustomization.yaml"
      if [ ! -f "$KUSTOMIZE_FILE" ]; then
        echo "❌ ERROR: File not found: $KUSTOMIZE_FILE"
        exit 1
      fi

      echo ""
      echo "🔍 Current image tags:"
      yq eval '.images[] | .name + " → " + .newTag' "$KUSTOMIZE_FILE"

      echo ""
      echo "✏️  Updating image tags to: $IMAGE_TAG"
      yq eval ".images[0].newTag = \"$IMAGE_TAG\"" -i "$KUSTOMIZE_FILE"
      yq eval ".images[1].newTag = \"$IMAGE_TAG\"" -i "$KUSTOMIZE_FILE"
      yq eval ".images[2].newTag = \"$IMAGE_TAG\"" -i "$KUSTOMIZE_FILE"

      echo ""
      echo "✅ New image tags:"
      yq eval '.images[] | .name + " → " + .newTag' "$KUSTOMIZE_FILE"

      if git diff --quiet "$KUSTOMIZE_FILE"; then
        echo ""
        echo "ℹ️  No changes detected - images already up to date"
        exit 0
      fi

      echo ""
      echo "📝 Changes to be committed:"
      git diff "$KUSTOMIZE_FILE"

      echo ""
      echo "📤 Committing changes..."
      git add "$KUSTOMIZE_FILE"

      git commit -m "🚀 Deploy $OVERLAY: Update images to $IMAGE_TAG

      Pipeline: $CI_PIPELINE_URL
      Commit: $CI_COMMIT_SHORT_SHA
      Branch: $CI_COMMIT_REF_NAME
      Job: $CI_JOB_ID
      Triggered by: $GITLAB_USER_LOGIN

      Images updated:
      - backend-image → amineelalami/ems-platform-backend:$IMAGE_TAG
      - frontend-image → amineelalami/ems-platform-frontend:$IMAGE_TAG
      - database-image → amineelalami/ems-platform-db:$IMAGE_TAG"

      echo ""
      echo "⬆️  Pushing to remote repository..."
      git push origin main

      echo ""
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "✅ GitOps manifests updated successfully!"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "🔍 ArgoCD will detect changes and sync automatically (~3 min)"
      echo "📊 Monitor deployment:"
      echo "   kubectl get applications -n argocd"
      echo "   kubectl get pods -n ems-platform -w"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev"'
      when: on_success
    - if: '$CI_COMMIT_REF_NAME == "main"'
      when: manual

  allow_failure: false

  tags:
    - linux
    - docker
    - ems-platform

notify_success:
  stage: gitops
  image: alpine:latest

  needs:
    - update_manifests

  script:
    - |
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "🎉 PIPELINE COMPLETED SUCCESSFULLY!"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo ""
      echo "📊 PIPELINE SUMMARY:"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "✅ Stage 1 - Setup: Dependencies installed"
      echo "✅ Stage 2 - Quality: Code quality verified"
      echo "✅ Stage 3 - Security: Security scans completed"
      echo "✅ Stage 4 - Test: All tests passed"
      echo "✅ Stage 5 - Analysis: SonarQube analysis done"
      echo "✅ Stage 6 - Build: 3 Docker images built"
      echo "✅ Stage 7 - Image Scan: Container scans completed"
      echo "✅ Stage 8 - Infrastructure: K8s manifests validated"
      echo "✅ Stage 9 - GitOps: Images pushed & manifests updated"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo ""

      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        echo "🚀 PRODUCTION DEPLOYMENT"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📦 Images:"
        echo "  • $FRONTEND_IMAGE:latest"
        echo "  • $BACKEND_IMAGE:latest"
        echo "  • $DB_IMAGE:latest"
      elif [ "$CI_COMMIT_REF_NAME" = "dev" ]; then
        echo "🛠️  DEVELOPMENT DEPLOYMENT"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📦 Images:"
        echo "  • $FRONTEND_IMAGE:$COMMIT_TAG"
        echo "  • $BACKEND_IMAGE:$COMMIT_TAG"
        echo "  • $DB_IMAGE:$COMMIT_TAG"
      fi

      echo ""
      echo "🔄 ArgoCD will deploy automatically"
      echo "⏱️  Completed: $(date '+%Y-%m-%d %H:%M:%S')"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  when: on_success

  tags:
    - linux
    - docker
    - ems-platform

cleanup:
  stage: gitops
  image: docker:24
  variables:
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker --version

  script:
    - |
      echo "🧹 Performing Pipeline Cleanup..."
      echo "🔍 Current Docker Disk Usage:"
      docker system df

      echo "🔄 Pruning unused resources..."
      docker system prune -f

      echo "✅ Cleanup completed"
      echo "🔍 Updated Docker Disk Usage:"
      docker system df

  when: always
  allow_failure: true
  timeout: 5 minutes

  tags:
    - linux
    - docker
    - ems-platform


# ========================================
# Workflow Rules
# ========================================
workflow:
  rules:
    # Run on main branch
    - if: '$CI_COMMIT_BRANCH == "main"'
    # Run on dev branch
    - if: '$CI_COMMIT_BRANCH == "dev"'
    # Run on merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'