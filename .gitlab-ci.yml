stages:
  - dependencies
  - security
  - validate_test
  - build
  - deploy
  - clean

variables:
  GIT_CLEAN_FLAGS: -ffdx -e client/node_modules/ -e backend/node_modules/
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"
  NODE_VERSION: "20"
  POSTGRES_VERSION: "15"
  NEXT_TELEMETRY_DISABLED: "1"
  NPM_CONFIG_PREFER_OFFLINE: "true"
  NPM_CONFIG_AUDIT: "false"
  FRONTEND_IMAGE: "amineelalami/ems-platform-frontend"
  BACKEND_IMAGE: "amineelalami/ems-platform-backend"
  DB_IMAGE: "amineelalami/ems-platform-db"
  COMMIT_TAG: "sha-${CI_COMMIT_SHORT_SHA}"
  LATEST_TAG: "latest"

.docker_template: &docker_template
  image: docker:24
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  before_script:
    - echo "🔧 Docker Environment Setup"
    - docker --version
    - docker info
    - echo "📦 Logging into Docker Hub..."
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - echo "🔍 Active Docker containers:"
    - docker ps -a
    - echo "🔍 Docker images:"
    - docker images
  tags:
    - windows
    - docker
    - ems-platform

.node_template: &node_template
  image: node:${NODE_VERSION}
  before_script:
    - echo "🔧 Node.js Environment Setup"
    - node --version
    - npm --version
    - echo "🔍 Disk space:"
    - df -h
  tags:
    - windows
    - docker
    - ems-platform

.node_postgres_template: &node_postgres_template
  image: node:${NODE_VERSION}
  services:
    - name: postgres:${POSTGRES_VERSION}
      alias: postgres
  variables:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: "ems_platform"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "password"
    DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  before_script:
    - echo "🔧 Node.js + PostgreSQL Environment Setup"
    - node --version
    - npm --version
    - echo "🔄 Waiting for PostgreSQL to be ready..."
    - |
      for i in {1..30}; do
        # Vérification simple avec timeout et echo
        if timeout 1 bash -c "echo > /dev/tcp/postgres/5432" 2>/dev/null; then
          echo "✅ PostgreSQL is ready!"
          break
        fi
        echo "⏳ Waiting for PostgreSQL... ($i/30)"
        sleep 2
      done
    - echo "🔍 Testing database connection..."
  tags:
    - windows
    - docker
    - ems-platform

.alpine_template: &alpine_template
  image: alpine:latest
  before_script:
    - echo "🔧 Alpine Linux Setup"
    - apk add --no-cache openssh-client curl postgresql-client
    - echo "🔍 SSH version:"
    - ssh -V
  tags:
    - windows
    - docker
    - ems-platform

install_frontend_deps:
  stage: dependencies
  <<: *node_template
  script:
    - echo "📦 Installing Frontend dependencies..."
    - cd client
    - echo "🔍 Project structure:"
    - ls -la
    - |
      install_deps() {
        echo "🗑️ Cleaning npm cache..."
        npm cache clean --force

        echo "📥 Attempting npm installation..."
        if npm install --no-audit --no-fund --loglevel=verbose; then
          echo "✅ Frontend dependencies installed successfully"
          return 0
        else
          echo "⚠️ First attempt failed, retrying with clean slate..."
          rm -rf node_modules package-lock.json
          npm cache clean --force
          if npm install --no-audit --no-fund; then
            echo "✅ Frontend dependencies installed on retry"
            return 0
          else
            echo "❌ Installation failed after retry"
            return 1
          fi
        fi
      }

      # Execute installation function
      install_deps
    - echo "📊 Dependency size:"
    - du -sh node_modules || echo "Could not calculate size"
  cache:
    key: "frontend-npm-${CI_COMMIT_REF_SLUG}"
    paths:
      - client/node_modules/
    policy: pull-push
  artifacts:
    paths:
      - client/node_modules/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 15 minutes

install_backend_deps:
  stage: dependencies
  <<: *node_postgres_template
  script:
    - echo "📦 Installing Backend dependencies..."
    - cd backend
    - echo "🔍 Project structure:"
    - ls -la
    - echo "🔍 Checking for existing node_modules..."
    - |
      if [ -d "node_modules" ]; then
        echo "🔄 node_modules found, using cache..."
        npm ci --prefer-offline --no-audit
        echo "✅ Backend dependencies updated from cache"
      else
        echo "📥 Full installation (no cache found)..."
        npm install --prefer-offline --no-audit --no-fund
        echo "✅ Backend dependencies installed"
      fi
    - echo "🗄️ Generating Prisma client..."
    - npx prisma generate --no-hints
    - echo "📊 Dependency size:"
    - du -sh node_modules || echo "Could not calculate size"
    - echo "🔍 Prisma client verification:"
    - ls -la node_modules/.prisma/client/ || echo "Prisma client not found"
  cache:
    key: "backend-npm-${CI_COMMIT_REF_SLUG}"
    paths:
      - backend/node_modules/
      - backend/node_modules/.prisma/
      - backend/node_modules/@prisma/
    policy: pull-push
  artifacts:
    paths:
      - backend/node_modules/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 10 minutes

audit_frontend:
  stage: security
  <<: *node_template
  dependencies:
    - install_frontend_deps
  script:
    - echo "🔒 Frontend security audit..."
    - cd client
    - echo "📋 Audit report:"
    - npm audit --audit-level high --production --json > audit-frontend.json || true
    - echo "✅ Frontend audit completed"
  artifacts:
    paths:
      - client/audit-frontend.json
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true
  timeout: 10 minutes

audit_backend:
  stage: security
  <<: *node_template
  dependencies:
    - install_backend_deps
  script:
    - echo "🔒 Backend security audit..."
    - cd backend
    - echo "📋 Audit report:"
    - npm audit --audit-level high --production --json > audit-backend.json 2>/dev/null || echo '{"vulnerabilities": {}}' > audit-backend.json
    - echo "✅ Backend audit completed"
  artifacts:
    paths:
      - backend/audit-backend.json
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true
  timeout: 10 minutes

validate_prisma_schema:
  stage: security
  <<: *node_postgres_template
  dependencies:
    - install_backend_deps
  script:
    - echo "🗄️ Prisma schema validation..."
    - cd backend
    - echo "📋 Prisma schema content (first 10 lines):"
    - head -10 prisma/schema.prisma
    - echo "🔍 Validating schema..."
    - npx prisma validate
    - echo "🔍 Checking database connection..."
    - npx prisma db execute --stdin --url "$DATABASE_URL" <<< "SELECT version();" || echo "Database connection failed"
    - echo "✅ Prisma schema validated"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 10 minutes

validate_frontend:
  stage: validate_test
  <<: *node_template
  dependencies:
    - install_frontend_deps
  script:
    - echo "🔍 Frontend build validation..."
    - cd client
    - echo "🔧 Building application..."
    - npm run build
    - echo "📊 Build size analysis:"
    - du -sh build/ || du -sh dist/ || echo "Build directory not found"
    - echo "✅ Frontend validated successfully"
  artifacts:
    paths:
      - client/build/
      - client/dist/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 10 minutes

validate_backend:
  stage: validate_test
  <<: *node_postgres_template
  dependencies:
    - install_backend_deps
  script:
    - echo "🔍 Backend validation..."
    - cd backend
    - echo "🔍 Checking project structure..."
    - |
      if [ -f "package.json" ]; then
        echo "📦 Package.json found - checking scripts..."
        # Vérifier si le script type-check existe
        if npm run | grep -q "type-check"; then
          echo "✅ TypeScript project detected - running type check..."
          # Exécuter directement tsc au lieu de npm run pour éviter les problèmes
          npx tsc --noEmit --skipLibCheck
          echo "✅ TypeScript validation passed"
        else
          echo "🔍 No type-check script found, checking for TypeScript files..."
          ts_files=$(find . -name "*.ts" -not -path "./node_modules/*" | wc -l)
          if [ "$ts_files" -gt 0 ]; then
            echo "✅ TypeScript files found - running basic type check..."
            npx tsc --noEmit --skipLibCheck 2>/dev/null || echo "⚠️ TypeScript check completed with warnings"
          else
            echo "✅ JavaScript project - no TypeScript files to check"
            echo "🔍 Running basic JavaScript validation..."
            # Valider seulement les fichiers JS principaux
            if [ -f "index.js" ]; then
              node -c index.js && echo "✅ index.js syntax is valid"
            fi
            if [ -f "src/index.js" ]; then
              node -c src/index.js && echo "✅ src/index.js syntax is valid"
            fi
            if [ -f "server.js" ]; then
              node -c server.js && echo "✅ server.js syntax is valid"
            fi
            echo "🎉 JavaScript project validation completed"
          fi
        fi
      else
        echo "❌ No package.json found in backend directory"
        exit 1
      fi
    - echo "✅ Backend validation completed successfully"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 10 minutes

test_frontend:
  stage: validate_test
  <<: *node_template
  dependencies:
    - install_frontend_deps
  script:
    - echo "🧪 Running Frontend tests..."
    - cd client
    - |
      if [ -f "package.json" ]; then
        if npm run | grep -q "test"; then
          echo "🔧 Test configuration:"
          npm run test -- --watchAll=false --passWithNoTests --listTests 2>/dev/null || true
          npm test -- --watchAll=false --passWithNoTests --silent --coverage
          echo "✅ Frontend tests completed"
        else
          echo "⚠️ No test script found in Frontend"
        fi
      fi
  artifacts:
    paths:
      - client/coverage/
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true
  timeout: 10 minutes

test_backend:
  stage: validate_test
  <<: *node_postgres_template
  dependencies:
    - install_backend_deps
  script:
    - |
      echo "🧪 Running Backend tests..."
      cd backend
      echo "🔧 Test environment setup..."
      echo "Database host: ${POSTGRES_HOST}"
      echo "Database port: ${POSTGRES_PORT}"
      echo "Database name: ${POSTGRES_DB}"
      npm run test:ci
      echo "✅ Backend tests completed"
  artifacts:
    paths:
      - backend/coverage/
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true
  timeout: 10 minutes

build_frontend_image:
  stage: build
  <<: *docker_template
  dependencies:
    - validate_frontend
  script:
    - echo "🏗️ Building Frontend image..."
    - echo "🔍 Build context:"
    - ls -la client/
    - docker build -t $FRONTEND_IMAGE:$COMMIT_TAG -t $FRONTEND_IMAGE:latest ./client
    - echo "🔍 Built images:"
    - docker images | grep "$FRONTEND_IMAGE"
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        echo "🚀 Pushing Frontend image to Docker Hub..."
        docker push $FRONTEND_IMAGE:$COMMIT_TAG
        docker push $FRONTEND_IMAGE:latest
        echo "✅ Frontend image pushed successfully"
      else
        echo "⏭️ Push skipped (dev branch - pre-production)"
      fi
    - echo "✅ Frontend image built"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 15 minutes

build_backend_image:
  stage: build
  <<: *docker_template
  dependencies:
    - validate_backend
  script:
    - echo "🏗️ Building Backend image..."
    - echo "🔍 Build context:"
    - ls -la backend/
    - docker build -t $BACKEND_IMAGE:$COMMIT_TAG -t $BACKEND_IMAGE:latest ./backend
    - echo "🔍 Built images:"
    - docker images | grep "$BACKEND_IMAGE"
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        echo "🚀 Pushing Backend image to Docker Hub..."
        docker push $BACKEND_IMAGE:$COMMIT_TAG
        docker push $BACKEND_IMAGE:latest
        echo "✅ Backend image pushed successfully"
      else
        echo "⏭️ Push skipped (dev branch - pre-production)"
      fi
    - echo "✅ Backend image built"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 15 minutes

build_db_image:
  stage: build
  <<: *docker_template
  script:
    - echo "🏗️ Building Database image..."
    - echo "🔍 Build context:"
    - ls -la db/
    - docker build -t $DB_IMAGE:$COMMIT_TAG -t $DB_IMAGE:latest ./db
    - echo "🔍 Built images:"
    - docker images | grep "$DB_IMAGE"
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        echo "🚀 Pushing Database image to Docker Hub..."
        docker push $DB_IMAGE:$COMMIT_TAG
        docker push $DB_IMAGE:latest
        echo "✅ Database image pushed successfully"
      else
        echo "⏭️ Push skipped (dev branch - pre-production)"
      fi
    - echo "✅ Database image built"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 10 minutes

deploy_staging:
  stage: deploy
  image: alpine:latest
  script:
    - echo "🚀 Deployment stage - Ready for future CD implementation"
    - echo "📋 This stage will handle automatic deployments to staging"
    - echo "🔧 Configure STAGING_DEPLOY_* variables when ready"
    - echo "✅ Deployment pipeline structure is ready"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev"'
      when: manual
  tags:
    - windows
    - docker
    - ems-platform
  timeout: 5 minutes

deploy_production:
  stage: deploy
  image: alpine:latest
  script:
    - echo "🚀 Deployment stage - Ready for future CD implementation"
    - echo "📋 This stage will handle manual deployments to production"
    - echo "🔧 Configure DEPLOY_* variables when ready"
    - echo "✅ Deployment pipeline structure is ready"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
      when: manual
  tags:
    - windows
    - docker
    - ems-platform
  timeout: 15 minutes

cleanup_docker:
  stage: clean
  <<: *docker_template
  script:
    - echo "🧹 Docker cleanup..."
    - echo "🔍 Before cleanup:"
    - docker system df
    - echo "🔄 Pruning system..."
    - docker system prune -f --filter "until=24h"
    - echo "🔍 After cleanup:"
    - docker system df
    - echo "✅ Cleanup completed"
  when: always
  allow_failure: true
  timeout: 10 minutes

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'