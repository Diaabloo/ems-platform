# ========================================
# EMS Platform - CI/CD Pipeline
# ========================================

stages:
  - setup # Dependency installation & caching
  - quality # Code quality checks (ESLint, Prettier)
  - security # Security audits & vulnerability scanning
  - test # Unit & integration tests with coverage
  - analysis # SonarQube code analysis
  - build # Docker image building
  - image_scan # Container security scanning
  - infrastructure # Kubernetes manifest validation
  - deploy # Deployment to K8s cluster
  - finalize # Image push & cleanup

# ========================================
# Global Variables
# ========================================
variables:
  # Git Configuration
  GIT_CLEAN_FLAGS: -ffdx -e client/node_modules/ -e backend/node_modules/
  GIT_DEPTH: "0"

  # Docker Configuration
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"

  # Node.js Configuration
  NODE_VERSION: "20"
  NODE_ENV: "ci"
  NPM_CONFIG_PREFER_OFFLINE: "true"
  NPM_CONFIG_AUDIT: "false"
  NEXT_TELEMETRY_DISABLED: "1"

  # Database Configuration
  POSTGRES_VERSION: "15"

  # Docker Image Configuration
  FRONTEND_IMAGE: "amineelalami/ems-platform-frontend"
  BACKEND_IMAGE: "amineelalami/ems-platform-backend"
  DB_IMAGE: "amineelalami/ems-platform-db"
  COMMIT_TAG: "sha-${CI_COMMIT_SHORT_SHA}"
  LATEST_TAG: "latest"

  # Testing Configuration
  COVERAGE_THRESHOLD: "80"
  TEST_TIMEOUT: "10000"
  CI: "true"

  # SonarQube Configuration
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  SONAR_HOST_URL: "http://host.docker.internal:9000"

  # Deployment Configuration
  NGROK_URL: "https://nonentomologic-spring-conflictedly.ngrok-free.dev"

# ========================================
# Reusable Templates
# ========================================

# Template: Docker Environment
.docker_template: &docker_template
  image: docker:24
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  before_script:
    - echo "🔧 Docker Environment Setup"
    - docker --version
    - docker info
    - echo "📦 Authenticating with Docker Hub..."
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  tags:
    - windows
    - docker
    - ems-platform

# Template: Node.js Environment
.node_template: &node_template
  image: node:${NODE_VERSION}
  before_script:
    - echo "🔧 Node.js Environment Setup"
    - node --version
    - npm --version
  tags:
    - windows
    - docker
    - ems-platform

# Template: Node.js + PostgreSQL Environment
.node_postgres_template: &node_postgres_template
  image: node:${NODE_VERSION}
  services:
    - name: postgres:${POSTGRES_VERSION}
      alias: postgres
      command:
        [
          "postgres",
          "-c",
          "shared_preload_libraries=pg_stat_statements",
          "-c",
          "max_connections=200",
          "-c",
          "log_statement=all",
        ]
  variables:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: "ems_platform"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "password"
    POSTGRES_HOST_AUTH_METHOD: "trust"
    DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  before_script:
    - echo "🔧 Node.js + PostgreSQL Environment Setup"
    - node --version
    - npm --version
    # Install PostgreSQL client tools if not present
    - if ! command -v pg_isready &> /dev/null; then apt-get update && apt-get install -y postgresql-client netcat-openbsd; fi
    # Wait for PostgreSQL to be ready
    - |
      echo "🔄 Waiting for PostgreSQL to be ready..."
      counter=0
      max_attempts=30
      until pg_isready -h postgres -p 5432 -U postgres || [ $counter -eq $max_attempts ]; do
        echo "⏳ Attempt $((counter + 1))/$max_attempts..."
        sleep 2
        counter=$((counter + 1))
      done
      if [ $counter -eq $max_attempts ]; then
        echo "❌ PostgreSQL failed to start!"
        exit 1
      fi
      echo "✅ PostgreSQL is ready!"
  tags:
    - windows
    - docker
    - ems-platform

# Template: Alpine Linux Environment
.alpine_template: &alpine_template
  image: alpine:latest
  before_script:
    - echo "🔧 Alpine Linux Setup"
    - apk add --no-cache openssh-client curl postgresql-client bc
  tags:
    - windows
    - docker
    - ems-platform

# Template: SonarQube Scanner
.sonarqube_template: &sonarqube_template
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  cache:
    key: "sonar-${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  before_script:
    - echo "🔧 SonarQube Scanner Setup"
    - sonar-scanner --version
  tags:
    - windows
    - docker
    - ems-platform

# Template: Trivy Security Scanner
.trivy_template: &trivy_template
  image: alpine:latest
  before_script:
    - echo "🔧 Installing Trivy Security Scanner..."
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - echo "✅ Trivy installed successfully"
    - trivy --version
  tags:
    - windows
    - docker
    - ems-platform

# ========================================
# STAGE 1: SETUP
# Install and cache dependencies
# ========================================

install_frontend_deps:
  stage: setup
  <<: *node_template
  script:
    - |
      echo "📦 Installing Frontend Dependencies..."
      cd client

      # Display project structure
      echo "🔍 Project Structure:"
      ls -la

      # Clean npm cache for fresh installation
      echo "🗑️ Cleaning npm cache..."
      npm cache clean --force

      # Install dependencies with verbose logging
      echo "📥 Installing dependencies..."
      npm install --no-audit --no-fund --loglevel=verbose

      echo "✅ Frontend dependencies installed successfully"

      # Display dependency size
      echo "📊 Dependency Size:"
      du -sh node_modules || echo "Could not calculate size"
  cache:
    key: "frontend-npm-${CI_COMMIT_REF_SLUG}"
    paths:
      - client/node_modules/
    policy: pull-push
  artifacts:
    paths:
      - client/node_modules/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 20 minutes
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

install_backend_deps:
  stage: setup
  <<: *node_template
  script:
    - |
      echo "📦 Installing Backend Dependencies..."
      cd backend

      # Display project structure
      echo "🔍 Project Structure:"
      ls -la

      # Check for existing node_modules (cache optimization)
      echo "🔍 Checking for cached dependencies..."
      if [ -d "node_modules" ]; then
        echo "🔄 Cache found! Using npm ci for faster installation..."
        npm ci --prefer-offline --no-audit
        echo "✅ Dependencies restored from cache"
      else
        echo "📥 No cache found. Performing full installation..."
        npm install --prefer-offline --no-audit --no-fund
        echo "✅ Dependencies installed successfully"
      fi

      # Verify Prisma installation
      echo "🔍 Verifying Prisma installation..."
      npx prisma@6.18.0 --version

      # Generate Prisma Client
      echo "🗄️ Generating Prisma Client..."
      npx prisma@6.18.0 generate --no-hints

      # Display dependency size
      echo "📊 Dependency Size:"
      du -sh node_modules || echo "Could not calculate size"
  cache:
    key: "backend-npm-${CI_COMMIT_REF_SLUG}"
    paths:
      - backend/node_modules/
      - backend/node_modules/.prisma/
      - backend/node_modules/@prisma/
    policy: pull-push
  artifacts:
    paths:
      - backend/node_modules/
      - backend/node_modules/.prisma/
      - backend/node_modules/@prisma/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 20 minutes
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ========================================
# STAGE 2: QUALITY
# Code quality checks and linting
# ========================================

eslint_frontend:
  stage: quality
  <<: *node_template
  dependencies:
    - install_frontend_deps
  script:
    - |
      echo "📝 Running ESLint on Frontend..."
      cd client

      # Create artifacts directory
      mkdir -p artifacts

      # Run ESLint with JSON output for reporting
      echo "🔍 Analyzing code quality..."
      npx eslint src/ \
        --format json \
        --output-file artifacts/eslint-frontend.json || true

      # Display results summary
      echo "📊 ESLint Results:"
      if [ -f "artifacts/eslint-frontend.json" ]; then
        echo "Report generated successfully"
      fi

      echo "✅ ESLint analysis completed"
  artifacts:
    paths:
      - client/artifacts/eslint-frontend.json
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

eslint_backend:
  stage: quality
  <<: *node_template
  dependencies:
    - install_backend_deps
  script:
    - |
      echo "📝 Running ESLint on Backend..."
      cd backend

      # Create artifacts directory
      mkdir -p artifacts

      # Run ESLint with JSON output for reporting
      echo "🔍 Analyzing code quality..."
      npx eslint . \
        --ext .js,.ts \
        --format json \
        --output-file artifacts/eslint-backend.json || true

      # Display results summary
      echo "📊 ESLint Results:"
      if [ -f "artifacts/eslint-backend.json" ]; then
        echo "Report generated successfully"
      fi

      echo "✅ ESLint analysis completed"
  artifacts:
    paths:
      - backend/artifacts/eslint-backend.json
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

prettier_check:
  stage: quality
  <<: *node_template
  dependencies:
    - install_frontend_deps
    - install_backend_deps
  script:
    - |
      echo "🎨 Running Prettier Formatting Check..."

      # Check Frontend formatting
      echo "📁 Checking Frontend formatting..."
      cd client
      npx prettier --check src/ || frontend_failed=true
      cd ..

      # Check Backend formatting
      echo "📁 Checking Backend formatting..."
      cd backend
      npx prettier --check . || backend_failed=true

      # Summary
      if [ "$frontend_failed" = true ] || [ "$backend_failed" = true ]; then
        echo "⚠️ Formatting issues detected. Run 'prettier --write' to fix."
      else
        echo "✅ All files are properly formatted"
      fi
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

# ========================================
# STAGE 3: SECURITY
# Security audits and vulnerability scanning
# ========================================

audit_frontend:
  stage: security
  <<: *node_template
  dependencies:
    - install_frontend_deps
  script:
    - |
      echo "🔒 Running Frontend Security Audit..."
      cd client

      # Create artifacts directory
      mkdir -p artifacts

      # Run npm audit for high-severity vulnerabilities
      echo "🔍 Scanning for vulnerabilities..."
      npm audit --audit-level high --production --json > artifacts/audit-frontend.json || true

      # Display summary
      echo "📊 Audit Summary:"
      if [ -f "artifacts/audit-frontend.json" ]; then
        echo "Security report generated"
      fi

      echo "✅ Frontend security audit completed"
  artifacts:
    paths:
      - client/artifacts/audit-frontend.json
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

audit_backend:
  stage: security
  <<: *node_template
  dependencies:
    - install_backend_deps
  script:
    - |
      echo "🔒 Running Backend Security Audit..."
      cd backend

      # Create artifacts directory
      mkdir -p artifacts

      # Run npm audit for high-severity vulnerabilities
      echo "🔍 Scanning for vulnerabilities..."
      npm audit --audit-level high --production --json > artifacts/audit-backend.json || true

      # Display summary
      echo "📊 Audit Summary:"
      if [ -f "artifacts/audit-backend.json" ]; then
        echo "Security report generated"
      fi

      echo "✅ Backend security audit completed"
  artifacts:
    paths:
      - backend/artifacts/audit-backend.json
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

validate_prisma_schema:
  stage: security
  <<: *node_postgres_template
  dependencies:
    - install_backend_deps
  script:
    - |
      echo "🗄️ Validating Prisma Schema..."
      cd backend

      # Validate schema syntax
      echo "🔍 Validating schema syntax..."
      npx prisma@6.18.0 validate

      # Test database connection
      echo "🔍 Testing database connection..."
      npx prisma@6.18.0 db execute --stdin --url "$DATABASE_URL" <<< "SELECT version();"

      echo "✅ Database connection verified"
      echo "✅ Prisma schema validation successful"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 15 minutes
  allow_failure: false

trivy_filesystem_scan:
  stage: security
  <<: *trivy_template
  script:
    - |
      echo "🔍 Running Trivy Filesystem Security Scan..."
      mkdir -p artifacts

      # Scan filesystem for vulnerabilities
      echo "📂 Scanning project files..."
      trivy filesystem . \
        --format json \
        --output artifacts/trivy-fs-scan.json || true

      trivy filesystem . \
        --format table \
        --output artifacts/trivy-fs-scan.txt || true

      echo "✅ Trivy filesystem scan completed"
  artifacts:
    paths:
      - artifacts/trivy-fs-scan.json
      - artifacts/trivy-fs-scan.txt
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

# ========================================
# STAGE 4: TEST
# Unit and integration tests with coverage
# ========================================

test_frontend:
  stage: test
  <<: *node_template
  dependencies:
    - install_frontend_deps
  script:
    - |
      echo "🧪 Running Frontend Tests with Coverage..."
      cd client

      # Create output directories
      mkdir -p test-results
      mkdir -p coverage

      # Run Jest tests with coverage
      echo "📊 Executing test suite..."
      ./node_modules/.bin/jest \
        --runInBand \
        --watchAll=false \
        --passWithNoTests \
        --silent \
        --coverage \
        --coverageDirectory=coverage \
        --collectCoverageFrom='["src/**/*.{js,jsx,ts,tsx}","!src/**/*.d.ts"]' \
        --coverageReporters=cobertura \
        --coverageReporters=html \
        --coverageReporters=text \
        --coverageReporters=lcov

      # Display coverage summary
      echo "📈 Test Coverage Summary:"
      if [ -f "coverage/coverage-summary.json" ]; then
        cat coverage/coverage-summary.json | grep -A 4 '"total"'
      fi

      echo "✅ Frontend tests completed successfully"
  artifacts:
    paths:
      - client/coverage/
      - client/test-results/
    reports:
      junit: client/test-results/*.xml
      coverage_report:
        coverage_format: cobertura
        path: client/coverage/cobertura-coverage.xml
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: false
  timeout: 15 minutes
  retry:
    max: 1
    when:
      - runner_system_failure

test_backend:
  stage: test
  <<: *node_postgres_template
  dependencies:
    - install_backend_deps
  script:
    - |
      echo "🧪 Running Backend Tests..."
      cd backend

      # Create coverage directory
      mkdir -p coverage

      # Run tests with CI configuration
      echo "📊 Executing test suite..."
      npm run test:ci || test_failed=true

      # Display results
      if [ "$test_failed" = true ]; then
        echo "⚠️ Some tests failed"
      else
        echo "✅ All tests passed"
      fi

      echo "✅ Backend tests completed"
  artifacts:
    paths:
      - backend/coverage/
    reports:
      junit: backend/test-results/*.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage/cobertura-coverage.xml
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true
  timeout: 10 minutes

# ========================================
# STAGE 5: ANALYSIS
# SonarQube code quality analysis
# ========================================

sonarqube_config:
  stage: analysis
  image: alpine:latest
  script:
    - |
      echo "🔧 SonarQube Configuration Check"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "📋 Environment Variables:"
      echo "  SONAR_HOST_URL: ${SONAR_HOST_URL:-❌ Not defined}"
      echo "  SONAR_TOKEN: $(if [ -n \"${SONAR_TOKEN:-}\" ]; then echo '✅ Defined'; else echo '❌ Not defined'; fi)"
      echo ""
      echo "⚠️  IMPORTANT: For Local Runner Setup"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "If SONAR_TOKEN is not defined:"
      echo "1. Edit: C:\\GitLab-Runner\\config.toml"
      echo "2. Add to [runners.environment]:"
      echo "   SONAR_TOKEN = \"your_sonarqube_token\""
      echo "3. Restart runner: gitlab-runner restart"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
      when: always
  tags:
    - windows
    - docker
    - ems-platform

sonarqube_frontend:
  stage: analysis
  <<: *sonarqube_template
  dependencies:
    - install_frontend_deps
    - test_frontend
  script:
    - |
      echo "📊 SonarQube Analysis - Frontend"

      # Verify SONAR_TOKEN is set
      if [ -z "${SONAR_TOKEN:-}" ]; then
        echo "❌ ERROR: SONAR_TOKEN is not defined!"
        echo "Please configure SONAR_TOKEN in your GitLab Runner"
        exit 1
      fi

      echo "✅ Configuration validated"
      echo "🔗 SonarQube Server: $SONAR_HOST_URL"

      # Run SonarQube analysis
      cd client

      sonar-scanner \
        -Dsonar.projectKey=ems-platform-frontend \
        -Dsonar.projectName="EMS Platform - Frontend" \
        -Dsonar.projectVersion=${CI_COMMIT_SHORT_SHA} \
        -Dsonar.sources=app,components,hooks,lib,styles \
        -Dsonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/** \
        -Dsonar.host.url=${SONAR_HOST_URL} \
        -Dsonar.login=${SONAR_TOKEN} \
        -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
        -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info \
        -Dsonar.qualitygate.wait=false

      echo "✅ Frontend analysis completed"
      echo "📈 View report: ${SONAR_HOST_URL}/dashboard?id=ems-platform-frontend"
  artifacts:
    paths:
      - client/.scannerwork/
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

sonarqube_backend:
  stage: analysis
  <<: *sonarqube_template
  dependencies:
    - install_backend_deps
    - test_backend
  script:
    - |
      echo "📊 SonarQube Analysis - Backend"

      # Verify SONAR_TOKEN is set
      if [ -z "${SONAR_TOKEN:-}" ]; then
        echo "❌ ERROR: SONAR_TOKEN is not defined!"
        exit 1
      fi

      echo "✅ Configuration validated"
      echo "🔗 SonarQube Server: $SONAR_HOST_URL"

      # Run SonarQube analysis
      cd backend

      sonar-scanner \
        -Dsonar.projectKey=ems-platform-backend \
        -Dsonar.projectName="EMS Platform - Backend" \
        -Dsonar.projectVersion=${CI_COMMIT_SHORT_SHA} \
        -Dsonar.sources=. \
        -Dsonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.js,**/*.spec.js \
        -Dsonar.host.url=${SONAR_HOST_URL} \
        -Dsonar.login=${SONAR_TOKEN} \
        -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
        -Dsonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/node_modules/** \
        -Dsonar.qualitygate.wait=false \
        -Dsonar.scm.provider=git

      echo "✅ Backend analysis completed"
      echo "📈 View report: ${SONAR_HOST_URL}/dashboard?id=ems-platform-backend"
  artifacts:
    paths:
      - backend/.scannerwork/
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

# ========================================
# STAGE 6: BUILD
# Docker image building
# ========================================

build_frontend_image:
  stage: build
  <<: *docker_template
  dependencies:
    - test_frontend
  script:
    - |
      echo "🏗️ Building Frontend Docker Image..."

      # Build image with multiple tags
      docker build \
        -t $FRONTEND_IMAGE:$COMMIT_TAG \
        -t $FRONTEND_IMAGE:latest \
        ./client

      # Display built images
      echo "🔍 Built Images:"
      docker images | grep "$FRONTEND_IMAGE"

      echo "✅ Frontend image built successfully"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 20 minutes
  retry:
    max: 1
    when:
      - runner_system_failure

build_backend_image:
  stage: build
  <<: *docker_template
  dependencies:
    - test_backend
  script:
    - |
      echo "🏗️ Building Backend Docker Image..."

      # Build image with multiple tags
      docker build \
        -t $BACKEND_IMAGE:$COMMIT_TAG \
        -t $BACKEND_IMAGE:latest \
        ./backend

      # Display built images
      echo "🔍 Built Images:"
      docker images | grep "$BACKEND_IMAGE"

      echo "✅ Backend image built successfully"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 15 minutes
  retry:
    max: 1
    when:
      - runner_system_failure

build_db_image:
  stage: build
  <<: *docker_template
  script:
    - |
      echo "🏗️ Building Database Docker Image..."

      # Verify build context
      echo "📂 Verifying build context..."
      pwd
      ls -la

      # Check if db directory exists
      if [ ! -d "db" ]; then
        echo "❌ ERROR: 'db' directory not found!"
        exit 1
      fi

      cd db
      echo "📂 Database Directory Contents:"
      ls -la

      # Verify schema.sql exists (should be version-controlled)
      if [ ! -f "schema.sql" ]; then
        echo "❌ ERROR: schema.sql not found in db/"
        echo "This file must be version-controlled"
        exit 1
      fi

      # Handle confidential data
      echo "🔒 Managing Confidential Data..."
      if [ "$CI_COMMIT_REF_NAME" = "main" ] && [ -f "${EMPLOYEEDB_DUMP_FILE}" ]; then
        echo "📦 Using confidential dump for production..."
        cp "${EMPLOYEEDB_DUMP_FILE}" employeedb_dump.sql
        echo "✅ Confidential data copied ($(wc -l < employeedb_dump.sql) lines)"
      elif [ "$CI_COMMIT_REF_NAME" = "dev" ]; then
        echo "🛠️ Development mode: Creating test data..."
        cat > employeedb_dump.sql << 'EOF'
      -- Development test data for EMS Platform
      -- This is NOT the real confidential data
      -- Real data is only used in production builds

      -- Test data initialization
      SELECT 'Development database initialized with test data' AS status;

      -- Add minimal test data
      INSERT INTO users (email, name) VALUES
        ('test@example.com', 'Test User'),
        ('dev@example.com', 'Development User')
      ON CONFLICT DO NOTHING;
      EOF
        echo "✅ Test data created for development"
      else
        echo "⚠️ No data file provided, empty database"
        echo "" > employeedb_dump.sql
      fi

      # Return to parent directory for build
      cd ..

      # Build Docker image
      echo "🔨 Building Docker image..."
      docker build \
        -t $DB_IMAGE:$COMMIT_TAG \
        -t $DB_IMAGE:latest \
        ./db

      # Display built images
      echo "🔍 Built Images:"
      docker images | grep "$DB_IMAGE"

      echo "✅ Database image built successfully"

      # Cleanup temporary file
      if [ -f "db/employeedb_dump.sql" ]; then
        rm db/employeedb_dump.sql
        echo "🧹 Temporary file cleaned"
      fi
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 10 minutes

# ========================================
# STAGE 7: IMAGE_SCAN
# Container security vulnerability scanning
# ========================================

trivy_scan_frontend:
  stage: image_scan
  <<: *trivy_template
  dependencies:
    - build_frontend_image
  script:
    - |
      echo "🔍 Scanning Frontend Image with Trivy..."
      mkdir -p artifacts

      # Scan container image for vulnerabilities
      echo "🔒 Running security scan..."
      trivy image \
        --format json \
        --output artifacts/trivy-frontend-scan.json \
        $FRONTEND_IMAGE:$COMMIT_TAG || true

      trivy image \
        --format table \
        --output artifacts/trivy-frontend-scan.txt \
        $FRONTEND_IMAGE:$COMMIT_TAG || true

      echo "✅ Frontend image scan completed"
  artifacts:
    paths:
      - artifacts/trivy-frontend-scan.json
      - artifacts/trivy-frontend-scan.txt
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

trivy_scan_backend:
  stage: image_scan
  <<: *trivy_template
  dependencies:
    - build_backend_image
  script:
    - |
      echo "🔍 Scanning Backend Image with Trivy..."
      mkdir -p artifacts

      # Scan container image for vulnerabilities
      echo "🔒 Running security scan..."
      trivy image \
        --format json \
        --output artifacts/trivy-backend-scan.json \
        $BACKEND_IMAGE:$COMMIT_TAG || true

      trivy image \
        --format table \
        --output artifacts/trivy-backend-scan.txt \
        $BACKEND_IMAGE:$COMMIT_TAG || true

      echo "✅ Backend image scan completed"
  artifacts:
    paths:
      - artifacts/trivy-backend-scan.json
      - artifacts/trivy-backend-scan.txt
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

trivy_scan_db:
  stage: image_scan
  <<: *trivy_template
  dependencies:
    - build_db_image
  script:
    - |
      echo "🔍 Scanning Database Image with Trivy..."
      mkdir -p artifacts

      # Scan container image for vulnerabilities
      echo "🔒 Running security scan..."
      trivy image \
        --format json \
        --output artifacts/trivy-db-scan.json \
        $DB_IMAGE:$COMMIT_TAG || true

      trivy image \
        --format table \
        --output artifacts/trivy-db-scan.txt \
        $DB_IMAGE:$COMMIT_TAG || true

      echo "✅ Database image scan completed"
  artifacts:
    paths:
      - artifacts/trivy-db-scan.json
      - artifacts/trivy-db-scan.txt
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

# ========================================
# STAGE 8: INFRASTRUCTURE
# Kubernetes manifest validation
# ========================================

k8s_yaml_validation:
  stage: infrastructure
  image: alpine:latest
  before_script:
    - apk add --no-cache py3-pip
    - pip3 install yamllint --break-system-packages
  script:
    - |
      echo "🔍 Validating Kubernetes YAML Manifests..."

      # Run yamllint with configuration
      yamllint -c .yamllint k8s/ || yaml_errors=true

      if [ "$yaml_errors" = true ]; then
        echo "❌ YAML validation failed!"
        exit 1
      fi

      echo "✅ YAML validation successful"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true
  tags:
    - windows
    - docker
    - ems-platform

kube_linter:
  stage: infrastructure
  image: alpine:latest
  before_script:
    - echo "🔧 Installing kube-linter..."
    - apk add --no-cache curl tar
    - curl -L https://github.com/stackrox/kube-linter/releases/download/v0.6.8/kube-linter-linux.tar.gz -o kube-linter.tar.gz
    - tar -xzf kube-linter.tar.gz
    - chmod +x kube-linter
    - mv kube-linter /usr/local/bin/
    - kube-linter version
  script:
    - |
      echo "🔍 Running kube-linter (Best Practices & Security)..."
      mkdir -p artifacts

      # Run kube-linter analysis
      echo "📋 Analyzing Kubernetes manifests..."
      kube-linter lint k8s/ \
        --format sarif > artifacts/kube-linter-report.sarif || true

      kube-linter lint k8s/ \
        --format plain || true

      echo "✅ kube-linter analysis completed"
  artifacts:
    paths:
      - artifacts/kube-linter-report.sarif
    expire_in: 1 week
    when: always
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  tags:
    - windows
    - docker
    - ems-platform

kubectl_dry_run:
  stage: infrastructure
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  before_script:
    - echo "🔧 Configuring kubectl..."
    - mkdir -p ~/.kube

    # Write kubeconfig
    - echo "$KUBECONFIG_CONTENT" > ~/.kube/config

    # Fix localhost issue for Local Runner
    - sed -i 's/127.0.0.1/host.docker.internal/g' ~/.kube/config
    - sed -i 's/localhost/host.docker.internal/g' ~/.kube/config

    # Display configuration
    - echo "🔍 Available contexts:"
    - kubectl config get-contexts || true

    - echo "📌 Current context:"
    - kubectl config current-context || echo "No context defined"

    # Try to use k3d context
    - echo "📌 Attempting to use k3d-ems-platform-cluster..."
    - kubectl config use-context k3d-ems-platform-cluster || kubectl config use-context $(kubectl config get-contexts -o name | head -n 1) || echo "⚠️ No context available"
  script:
    - |
      echo "🚫 Simulating Complete Deployment (dry-run)..."

      # Run kubectl dry-run
      kubectl apply \
        --dry-run=client \
        --validate=false \
        -f k8s/ \
        --recursive || true

      echo "✅ Dry-run completed (validation disabled - no cluster connection)"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true
  tags:
    - windows
    - docker
    - ems-platform

kubeconform_validate:
  stage: infrastructure
  image: alpine:latest
  before_script:
    - echo "🔧 Installing kubeconform..."
    - apk add --no-cache curl tar
    - curl -L https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
    - tar -xzf kubeconform.tar.gz
    - chmod +x kubeconform
    - mv kubeconform /usr/local/bin/
  script:
    - |
      echo "🔍 Validating Against Official Kubernetes Schema..."

      # Run kubeconform validation
      kubeconform \
        -schema-location default \
        -ignore-missing-schemas \
        -summary \
        k8s/ || true

      echo "✅ kubeconform validation completed"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true
  tags:
    - windows
    - docker
    - ems-platform

# ========================================
# STAGE 9: DEPLOY
# Deployment to Kubernetes cluster
# ========================================

deploy:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  before_script:
    - echo "🚀 Configuring k3d Cluster Access..."
    - mkdir -p ~/.kube

    # Write kubeconfig
    - echo "$KUBECONFIG_CONTENT" > ~/.kube/config

    # Fix localhost for Docker Desktop networking
    - sed -i 's/127.0.0.1/host.docker.internal/g' ~/.kube/config
    - sed -i 's/localhost/host.docker.internal/g' ~/.kube/config
  script:
    - |
      echo "🔍 Verifying kubectl configuration..."
      kubectl config view --minify

      echo "🔍 Testing cluster connection..."
      kubectl cluster-info || (echo "❌ Cannot connect to cluster!" && exit 1)

      echo "✅ Cluster connection successful!"
      kubectl get nodes

      echo "🔍 Checking/Creating namespace ems-platform..."
      kubectl get namespace ems-platform || kubectl create namespace ems-platform

      echo "📦 Deploying Kubernetes resources..."
      kubectl apply -k k8s/_global/ || (echo "❌ Deployment failed!" && exit 1)

      echo "⏳ Waiting for pods to start (timeout: 3min)..."
      kubectl wait \
        --for=condition=ready \
        pod -l app=frontend \
        -n ems-platform \
        --timeout=180s || echo "⚠️ Frontend not ready yet"

      kubectl wait \
        --for=condition=ready \
        pod -l app=backend \
        -n ems-platform \
        --timeout=180s || echo "⚠️ Backend not ready yet"

      echo "🎯 Deployment Status:"
      kubectl get deployments -n ems-platform

      echo "📊 Pod Status:"
      kubectl get pods -n ems-platform -o wide

      echo "🔗 Exposed Services:"
      kubectl get svc -n ems-platform

      echo "🌐 Ingress Configuration:"
      kubectl get ingress -n ems-platform || echo "No ingress found"

      echo "✅ Deployment completed successfully!"
      echo "🌍 Application accessible via: $NGROK_URL"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev"'
      when: manual
    - if: '$CI_COMMIT_REF_NAME == "main"'
      when: manual
  allow_failure: false
  timeout: 10 minutes
  tags:
    - windows
    - docker
    - ems-platform

# ========================================
# STAGE 10: FINALIZE
# Image push and cleanup
# ========================================

push_images:
  stage: finalize
  <<: *docker_template
  dependencies:
    - trivy_scan_frontend
    - trivy_scan_backend
    - trivy_scan_db
  script:
    - |
      echo "🚀 Pushing Images to Docker Hub..."

      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        echo "📦 Pushing Production Images..."

        # Push Frontend
        echo "⬆️ Pushing Frontend..."
        docker push $FRONTEND_IMAGE:$COMMIT_TAG
        docker push $FRONTEND_IMAGE:latest

        # Push Backend
        echo "⬆️ Pushing Backend..."
        docker push $BACKEND_IMAGE:$COMMIT_TAG
        docker push $BACKEND_IMAGE:latest

        # Push Database
        echo "⬆️ Pushing Database..."
        docker push $DB_IMAGE:$COMMIT_TAG
        docker push $DB_IMAGE:latest

        echo "✅ All production images pushed successfully"

      elif [ "$CI_COMMIT_REF_NAME" = "dev" ]; then
        echo "📦 Pushing Development Images..."

        # Push with commit SHA only
        docker push $FRONTEND_IMAGE:$COMMIT_TAG
        docker push $BACKEND_IMAGE:$COMMIT_TAG
        docker push $DB_IMAGE:$COMMIT_TAG

        echo "✅ Development images pushed successfully"
      fi

      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "📦 Pushed Images:"
      echo "  Frontend: $FRONTEND_IMAGE:$COMMIT_TAG"
      echo "  Backend:  $BACKEND_IMAGE:$COMMIT_TAG"
      echo "  Database: $DB_IMAGE:$COMMIT_TAG"
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        echo "  (Also tagged as :latest)"
      fi
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 15 minutes
  tags:
    - windows
    - docker
    - ems-platform

