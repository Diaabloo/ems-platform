stages:
  - setup
  - quality
  - security
  - test
  - analysis
  - build
  - image_scan
  - infrastructure
  - deploy
  - finalize

# === Variables globales ===
variables:
  GIT_CLEAN_FLAGS: -ffdx -e client/node_modules/ -e backend/node_modules/
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"
  NODE_VERSION: "20"
  POSTGRES_VERSION: "15"
  NEXT_TELEMETRY_DISABLED: "1"
  NPM_CONFIG_PREFER_OFFLINE: "true"
  NPM_CONFIG_AUDIT: "false"
  FRONTEND_IMAGE: "amineelalami/ems-platform-frontend"
  BACKEND_IMAGE: "amineelalami/ems-platform-backend"
  DB_IMAGE: "amineelalami/ems-platform-db"
  COMMIT_TAG: "sha-${CI_COMMIT_SHORT_SHA}"
  LATEST_TAG: "latest"
  COVERAGE_THRESHOLD: "80"
  TEST_TIMEOUT: "10000"
  NODE_ENV: "ci"
  CI: "true"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  SONAR_HOST_URL: "http://host.docker.internal:9000"
  NGROK_URL: "https://nonentomologic-spring-conflictedly.ngrok-free.dev"
  KUBECONFIG_SERVER_IP: "host.docker.internal"

# === TEMPLATES ===
.docker_template: &docker_template
  image: docker:24
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  before_script:
    - echo "🔧 Docker Environment Setup"
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  tags:
    - windows
    - docker
    - ems-platform

.node_template: &node_template
  image: node:${NODE_VERSION}
  before_script:
    - echo "🔧 Node.js Environment Setup"
    - node --version
    - npm --version
  tags:
    - windows
    - docker
    - ems-platform

.node_postgres_template: &node_postgres_template
  image: node:${NODE_VERSION}
  services:
    - name: postgres:${POSTGRES_VERSION}
      alias: postgres
  variables:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: "ems_platform"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "password"
    POSTGRES_HOST_AUTH_METHOD: "trust"
    DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  before_script:
    - echo "🔧 Node.js + PostgreSQL Environment Setup"
    # Optimisation : installer uniquement si manquant
    - if ! command -v pg_isready &> /dev/null; then apt-get update && apt-get install -y netcat-openbsd postgresql-client; fi
    - echo "🔄 Waiting for PostgreSQL to be ready..."
    - |
      counter=0
      until pg_isready -h postgres -p 5432 -U postgres || [ $counter -eq 15 ]; do
        echo "⏳ Waiting for PostgreSQL... ($counter/15)"
        sleep 2
        counter=$((counter + 1))
      done
  tags:
    - windows
    - docker
    - ems-platform

.sonarqube_template: &sonarqube_template
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    SONAR_SCANNER_OPTS: "-Xmx512m"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  tags:
    - windows
    - docker
    - ems-platform

.trivy_template: &trivy_template
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  tags:
    - windows
    - docker
    - ems-platform

# === SETUP STAGE ===
install_frontend_deps:
  stage: setup
  <<: *node_template
  script:
    - cd client
    - npm ci --no-audit --no-fund
  cache:
    key: "frontend-npm-${CI_COMMIT_REF_SLUG}"
    paths:
      - client/node_modules/
    policy: pull-push
  artifacts:
    paths:
      - client/node_modules/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'

install_backend_deps:
  stage: setup
  <<: *node_template
  script:
    - cd backend
    - npm ci --prefer-offline --no-audit
    - npx prisma@6.18.0 generate
  cache:
    key: "backend-npm-${CI_COMMIT_REF_SLUG}"
    paths:
      - backend/node_modules/
      - backend/node_modules/.prisma/
      - backend/node_modules/@prisma/
    policy: pull-push
  artifacts:
    paths:
      - backend/node_modules/
      - backend/node_modules/.prisma/
      - backend/node_modules/@prisma/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'

# === QUALITY STAGE ===
eslint_frontend:
  stage: quality
  <<: *node_template
  dependencies: [install_frontend_deps]
  script:
    - cd client
    - mkdir -p artifacts
    - npx eslint src/ --format json --output-file artifacts/eslint-frontend.json || true
  artifacts:
    paths: [client/artifacts/eslint-frontend.json]
    when: always
  allow_failure: true

eslint_backend:
  stage: quality
  <<: *node_template
  dependencies: [install_backend_deps]
  script:
    - cd backend
    - mkdir -p artifacts
    - npx eslint . --ext .js,.ts --format json --output-file artifacts/eslint-backend.json || true
  artifacts:
    paths: [backend/artifacts/eslint-backend.json]
    when: always
  allow_failure: true

prettier_check:
  stage: quality
  <<: *node_template
  dependencies: [install_frontend_deps, install_backend_deps]
  script:
    - cd client && npx prettier --check src/ || true
    - cd ../backend && npx prettier --check . || true
  allow_failure: true

# === SECURITY STAGE ===
audit_frontend:
  stage: security
  <<: *node_template
  dependencies: [install_frontend_deps]
  script:
    - cd client
    - mkdir -p artifacts
    - npm audit --audit-level high --production --json > artifacts/audit-frontend.json || true
  artifacts:
    paths: [client/artifacts/audit-frontend.json]
    when: always
  allow_failure: true

validate_prisma_schema:
  stage: security
  <<: *node_postgres_template
  dependencies: [install_backend_deps]
  script:
    - cd backend
    - npx prisma@6.18.0 validate
    - npx prisma@6.18.0 db execute --stdin --url "$DATABASE_URL" <<< "SELECT version();"

trivy_filesystem_scan:
  stage: security
  <<: *trivy_template
  script:
    - mkdir -p artifacts
    - trivy filesystem . --format table --output artifacts/trivy-fs-scan.txt || true
  artifacts:
    paths: [artifacts/trivy-fs-scan.txt]
    when: always
  allow_failure: true

# === TEST STAGE ===
test_frontend:
  stage: test
  <<: *node_template
  dependencies: [install_frontend_deps]
  script:
    - cd client
    - npm test -- --coverage --watchAll=false --passWithNoTests
  artifacts:
    paths: [client/coverage/]
  timeout: 15 minutes

test_backend:
  stage: test
  <<: *node_postgres_template
  dependencies: [install_backend_deps]
  script:
    - cd backend
    - npm run test:ci || true
  artifacts:
    paths: [backend/coverage/]
  allow_failure: true

# === ANALYSIS STAGE (SONARQUBE) ===
sonarqube_frontend:
  stage: analysis
  <<: *sonarqube_template
  dependencies: [install_frontend_deps, test_frontend]
  script:
    - cd client
    - sonar-scanner -Dsonar.projectKey=ems-platform-frontend -Dsonar.sources=src -Dsonar.host.url=${SONAR_HOST_URL} -Dsonar.login=${SONAR_TOKEN}
  allow_failure: true

sonarqube_backend:
  stage: analysis
  <<: *sonarqube_template
  dependencies: [install_backend_deps, test_backend]
  script:
    - cd backend
    - sonar-scanner -Dsonar.projectKey=ems-platform-backend -Dsonar.sources=. -Dsonar.host.url=${SONAR_HOST_URL} -Dsonar.login=${SONAR_TOKEN}
  allow_failure: true

# === BUILD STAGE ===
build_frontend_image:
  stage: build
  <<: *docker_template
  script:
    - docker build -t $FRONTEND_IMAGE:$COMMIT_TAG -t $FRONTEND_IMAGE:latest ./client
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'

build_backend_image:
  stage: build
  <<: *docker_template
  script:
    - docker build -t $BACKEND_IMAGE:$COMMIT_TAG -t $BACKEND_IMAGE:latest ./backend
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'

build_db_image:
  stage: build
  <<: *docker_template
  script:
    - cd db
    - |
      if [ "$CI_COMMIT_REF_NAME" = "dev" ]; then
        echo "CREATE TABLE IF NOT EXISTS dev_init (id serial primary key);" > employeedb_dump.sql
      fi
    - cd ..
    - docker build -t $DB_IMAGE:$COMMIT_TAG -t $DB_IMAGE:latest ./db
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'

# === IMAGE_SCAN STAGE ===
trivy_scan_frontend:
  stage: image_scan
  <<: *trivy_template
  dependencies: [build_frontend_image]
  script:
    - trivy image $FRONTEND_IMAGE:$COMMIT_TAG || true
  allow_failure: true

# === INFRASTRUCTURE STAGE ===
kubectl_dry_run:
  stage: infrastructure
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_CONTENT" > ~/.kube/config
    - sed -i "s/localhost/${KUBECONFIG_SERVER_IP}/g" ~/.kube/config
    - sed -i "s/127.0.0.1/${KUBECONFIG_SERVER_IP}/g" ~/.kube/config
  script:
    - kubectl apply --dry-run=client -f k8s/ --recursive || true
  tags: [windows, docker, ems-platform]

# === FINALIZE STAGE ===
push_images:
  stage: finalize
  <<: *docker_template
  script:
    - docker push $FRONTEND_IMAGE:$COMMIT_TAG
    - docker push $BACKEND_IMAGE:$COMMIT_TAG
    - docker push $DB_IMAGE:$COMMIT_TAG
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'

cleanup:
  stage: finalize
  <<: *docker_template
  script:
    - docker system prune -f
  when: always
  allow_failure: true

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
