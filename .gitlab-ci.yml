# ============================================
# EMS Platform - Pipeline Final Complet
# ============================================

stages:
  - setup
  - quality
  - security
  - test
  - analysis
  - build
  - image_scan
  - infrastructure
  - deploy
  - finalize

# Variables globales
variables:
  GIT_CLEAN_FLAGS: -ffdx -e client/node_modules/ -e backend/node_modules/
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"
  NODE_VERSION: "20"
  POSTGRES_VERSION: "15"
  NEXT_TELEMETRY_DISABLED: "1"
  NPM_CONFIG_PREFER_OFFLINE: "true"
  NPM_CONFIG_AUDIT: "false"
  FRONTEND_IMAGE: "amineelalami/ems-platform-frontend"
  BACKEND_IMAGE: "amineelalami/ems-platform-backend"
  DB_IMAGE: "amineelalami/ems-platform-db"
  COMMIT_TAG: "sha-${CI_COMMIT_SHORT_SHA}"
  LATEST_TAG: "latest"
  COVERAGE_THRESHOLD: "80"
  TEST_TIMEOUT: "10000"
  NODE_ENV: "ci"
  CI: "true"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  SONAR_HOST_URL: "http://host.docker.internal:9000"
  NGROK_URL: "https://nonentomologic-spring-conflictedly.ngrok-free.dev"

# === TEMPLATES ===
.docker_template: &docker_template
  image: docker:24
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  before_script:
    - echo "🔧 Docker Environment Setup"
    - docker --version
    - docker info
    - echo "📦 Logging into Docker Hub..."
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  tags:
    - windows
    - docker
    - ems-platform

.node_template: &node_template
  image: node:${NODE_VERSION}
  before_script:
    - echo "🔧 Node.js Environment Setup"
    - node --version
    - npm --version
  tags:
    - windows
    - docker
    - ems-platform

.node_postgres_template: &node_postgres_template
  image: node:${NODE_VERSION}
  services:
    - name: postgres:${POSTGRES_VERSION}
      alias: postgres
      command:
        [
          "postgres",
          "-c",
          "shared_preload_libraries=pg_stat_statements",
          "-c",
          "max_connections=200",
          "-c",
          "log_statement=all",
        ]
  variables:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: "ems_platform"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "password"
    POSTGRES_HOST_AUTH_METHOD: "trust"
    DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  before_script:
    - echo "🔧 Node.js + PostgreSQL Environment Setup"
    - node --version
    - npm --version
    - echo "📦 Installing dependencies for PostgreSQL connection testing..."
    - apt-get update && apt-get install -y netcat-openbsd postgresql-client
    - echo "🔄 Waiting for PostgreSQL to be ready..."
    - |
      counter=0
      until pg_isready -h postgres -p 5432 -U postgres || [ $counter -eq 30 ]; do
        echo "⏳ Waiting for PostgreSQL... ($counter/30)"
        sleep 2
        counter=$((counter + 1))
      done
  tags:
    - windows
    - docker
    - ems-platform

.alpine_template: &alpine_template
  image: alpine:latest
  before_script:
    - echo "🔧 Alpine Linux Setup"
    - apk add --no-cache openssh-client curl postgresql-client bc
  tags:
    - windows
    - docker
    - ems-platform

.sonarqube_template: &sonarqube_template
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  before_script:
    - echo "🔧 SonarQube Scanner Setup"
    - sonar-scanner --version
  tags:
    - windows
    - docker
    - ems-platform

.trivy_template: &trivy_template
  image: alpine:latest
  before_script:
    - echo "🔧 Installing Trivy..."
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - echo "✅ Trivy installed:"
    - trivy --version
  tags:
    - windows
    - docker
    - ems-platform

# === SETUP STAGE ===
install_frontend_deps:
  stage: setup
  <<: *node_template
  script:
    - |
      echo "📦 Installing Frontend dependencies..."
      cd client
      echo "🔍 Project structure:"
      ls -la
      echo "🗑️ Cleaning npm cache..."
      npm cache clean --force
      echo "📥 Attempting npm installation..."
      npm install --no-audit --no-fund --loglevel=verbose
      echo "✅ Frontend dependencies installed successfully"
      echo "📊 Dependency size:"
      du -sh node_modules || echo "Could not calculate size"
  cache:
    key: "frontend-npm-${CI_COMMIT_REF_SLUG}"
    paths:
      - client/node_modules/
    policy: pull-push
  artifacts:
    paths:
      - client/node_modules/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 20 minutes

install_backend_deps:
  stage: setup
  <<: *node_postgres_template
  script:
    - |
      echo "📦 Installing Backend dependencies..."
      cd backend
      echo "🔍 Project structure:"
      ls -la
      echo "🔍 Checking for existing node_modules..."
      if [ -d "node_modules" ]; then
        echo "🔄 node_modules found, using cache..."
        npm ci --prefer-offline --no-audit
        echo "✅ Backend dependencies updated from cache"
      else
        echo "📥 Full installation (no cache found)..."
        npm install --prefer-offline --no-audit --no-fund
        echo "✅ Backend dependencies installed"
      fi
      echo "🔍 Verifying Prisma installation..."
      npx prisma@6.18.0 --version
      echo "🗄️ Generating Prisma client..."
      npx prisma@6.18.0 generate --no-hints
      echo "📊 Dependency size:"
      du -sh node_modules || echo "Could not calculate size"
  cache:
    key: "backend-npm-${CI_COMMIT_REF_SLUG}"
    paths:
      - backend/node_modules/
      - backend/node_modules/.prisma/
      - backend/node_modules/@prisma/
    policy: pull-push
  artifacts:
    paths:
      - backend/node_modules/
      - backend/node_modules/.prisma/
      - backend/node_modules/@prisma/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 20 minutes

# === QUALITY STAGE ===
eslint_frontend:
  stage: quality
  <<: *node_template
  dependencies:
    - install_frontend_deps
  script:
    - |
      echo "📝 Running ESLint on Frontend..."
      cd client
      mkdir -p artifacts
      npx eslint src/ --format json --output-file artifacts/eslint-frontend.json || true
      echo "✅ ESLint completed"
  artifacts:
    paths:
      - client/artifacts/eslint-frontend.json
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

eslint_backend:
  stage: quality
  <<: *node_template
  dependencies:
    - install_backend_deps
  script:
    - |
      echo "📝 Running ESLint on Backend..."
      cd backend
      mkdir -p artifacts
      npx eslint . --ext .js,.ts --format json --output-file artifacts/eslint-backend.json || true
      echo "✅ ESLint completed"
  artifacts:
    paths:
      - backend/artifacts/eslint-backend.json
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

# === JOB RESTAURÉ : Prettier Check ===
prettier_check:
  stage: quality
  <<: *node_template
  dependencies:
    - install_frontend_deps
    - install_backend_deps
  script:
    - |
      echo "🎨 Running Prettier check..."
      echo "📁 Frontend formatting..."
      cd client && npx prettier --check src/ || true
      cd ..
      echo "📁 Backend formatting..."
      cd backend && npx prettier --check . || true
      echo "✅ Prettier check completed"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

# === SECURITY STAGE ===
audit_frontend:
  stage: security
  <<: *node_template
  dependencies:
    - install_frontend_deps
  script:
    - |
      echo "🔒 Frontend security audit..."
      cd client
      mkdir -p artifacts
      npm audit --audit-level high --production --json > artifacts/audit-frontend.json || true
      echo "✅ Frontend audit completed"
  artifacts:
    paths:
      - client/artifacts/audit-frontend.json
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

audit_backend:
  stage: security
  <<: *node_template
  dependencies:
    - install_backend_deps
  script:
    - |
      echo "🔒 Backend security audit..."
      cd backend
      mkdir -p artifacts
      npm audit --audit-level high --production --json > artifacts/audit-backend.json || true
      echo "✅ Backend audit completed"
  artifacts:
    paths:
      - backend/artifacts/audit-backend.json
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

# === JOB RESTAURÉ : Validate Prisma Schema ===
validate_prisma_schema:
  stage: security
  <<: *node_postgres_template
  dependencies:
    - install_backend_deps
  script:
    - |
      echo "🗄️ Prisma schema validation..."
      cd backend
      echo "🔍 Validating schema syntax..."
      npx prisma@6.18.0 validate
      echo "🔍 Testing database connection..."
      npx prisma@6.18.0 db execute --stdin --url "$DATABASE_URL" <<< "SELECT version();"
      echo "✅ Database connection successful"
      echo "✅ Prisma schema validated successfully"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 15 minutes
  allow_failure: false

trivy_filesystem_scan:
  stage: security
  <<: *trivy_template
  script:
    - |
      echo "🔍 Trivy Filesystem Security Scan..."
      mkdir -p artifacts
      trivy filesystem . --format json --output artifacts/trivy-fs-scan.json || true
      trivy filesystem . --format table --output artifacts/trivy-fs-scan.txt || true
      echo "✅ Trivy filesystem scan completed"
  artifacts:
    paths:
      - artifacts/trivy-fs-scan.json
      - artifacts/trivy-fs-scan.txt
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

# === TEST STAGE ===
test_frontend:
  stage: test
  <<: *node_template
  dependencies:
    - install_frontend_deps
  script:
    - |
      echo "🧪 Running Frontend tests with coverage..."
      cd client
      mkdir -p test-results
      mkdir -p coverage

      echo "📊 Running tests with coverage..."
      ./node_modules/.bin/jest --runInBand --watchAll=false --passWithNoTests --silent \
        --coverage --coverageDirectory=coverage \
        --collectCoverageFrom="[\"src/**/*.{js,jsx,ts,tsx}\",\"!src/**/*.d.ts\"]" \
        --coverageReporters=cobertura --coverageReporters=html --coverageReporters=text --coverageReporters=lcov

      echo "📈 Test Coverage Summary:"
      if [ -f "coverage/coverage-summary.json" ]; then
        cat coverage/coverage-summary.json | grep -A 4 '"total"'
      fi

      echo "✅ Frontend tests completed"
  artifacts:
    paths:
      - client/coverage/
      - client/test-results/
    reports:
      junit: client/test-results/*.xml
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: false
  timeout: 15 minutes

test_backend:
  stage: test
  <<: *node_postgres_template
  dependencies:
    - install_backend_deps
  script:
    - |
      echo "🧪 Running Backend tests..."
      cd backend
      mkdir -p coverage
      npm run test:ci
      echo "✅ Backend tests completed"
  artifacts:
    paths:
      - backend/coverage/
    reports:
      junit: backend/test-results/*.xml
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true
  timeout: 10 minutes

# === ANALYSIS STAGE (SONARQUBE) ===
sonarqube_config:
  stage: analysis
  image: alpine:latest
  script:
    - |
      echo "🔧 Configuration SonarQube"
      echo "📋 Vérification des variables d'environnement..."
      echo "SONAR_HOST_URL: ${SONAR_HOST_URL:-Non défini}"
      echo "SONAR_TOKEN: $(if [ -n \"${SONAR_TOKEN:-}\" ]; then echo '✅ DÉFINI'; else echo '❌ NON DÉFINI'; fi)"
      echo ""
      echo "⚠️  IMPORTANT: Si SONAR_TOKEN n'est pas défini dans le runner local:"
      echo "1. Éditez C:\GitLab-Runner\config.toml"
      echo "2. Ajoutez dans [runners.environment]:"
      echo "   SONAR_TOKEN = \"votre_token_sonarqube\""
      echo "3. Redémarrez: gitlab-runner restart"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
      when: always

sonarqube_frontend:
  stage: analysis
  <<: *sonarqube_template
  dependencies:
    - install_frontend_deps
    - test_frontend
  script:
    - |
      echo "📊 Analyse SonarQube - Frontend"

      if [ -z "${SONAR_TOKEN:-}" ]; then
        echo "❌ ERREUR: SONAR_TOKEN non défini!"
        exit 1
      fi

      echo "✅ Configuration valide"

      # Analyse (simplifiée)
      cd client

      sonar-scanner \
        -Dsonar.projectKey=ems-platform-frontend \
        -Dsonar.projectName="EMS Platform - Frontend" \
        -Dsonar.projectVersion=${CI_COMMIT_SHORT_SHA} \
        -Dsonar.sources=app,components,hooks,lib,styles \
        -Dsonar.exclusions=**/node_modules/**,**/.next/** \
        -Dsonar.host.url=${SONAR_HOST_URL} \
        -Dsonar.login=${SONAR_TOKEN} \
        -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
        -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info \
        -Dsonar.qualitygate.wait=false

      echo "✅ Analyse SonarQube frontend terminée"
  artifacts:
    paths:
      - client/.scannerwork/
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

sonarqube_backend:
  stage: analysis
  <<: *sonarqube_template
  dependencies:
    - install_backend_deps
    - test_backend
  script:
    - |
      echo "📊 Analyse SonarQube - Backend"

      if [ -z "${SONAR_TOKEN:-}" ]; then
        echo "❌ SONAR_TOKEN non défini"
        exit 1
      fi

      echo "✅ Configuration valide"
      echo "🔗 SonarQube: $SONAR_HOST_URL"

      # Analyse
      cd backend
      sonar-scanner \
        -Dsonar.projectKey=ems-platform-backend \
        -Dsonar.projectName="EMS Platform - Backend" \
        -Dsonar.projectVersion=${CI_COMMIT_SHORT_SHA} \
        -Dsonar.sources=. \
        -Dsonar.host.url=${SONAR_HOST_URL} \
        -Dsonar.login=${SONAR_TOKEN} \
        -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
        -Dsonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/node_modules/** \
        -Dsonar.qualitygate.wait=false \
        -Dsonar.scm.provider=git

      echo "✅ Analyse SonarQube backend terminée"
      echo "📈 Rapport: ${SONAR_HOST_URL}/dashboard?id=ems-platform-backend"
  artifacts:
    paths:
      - backend/.scannerwork/
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

# === BUILD STAGE ===
build_frontend_image:
  stage: build
  <<: *docker_template
  dependencies:
    - test_frontend
  script:
    - |
      echo "🏗️ Building Frontend image..."
      docker build -t $FRONTEND_IMAGE:$COMMIT_TAG -t $FRONTEND_IMAGE:latest ./client
      echo "🔍 Built images:"
      docker images | grep "$FRONTEND_IMAGE"
      echo "✅ Frontend image built"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 20 minutes

build_backend_image:
  stage: build
  <<: *docker_template
  dependencies:
    - test_backend
  script:
    - |
      echo "🏗️ Building Backend image..."
      docker build -t $BACKEND_IMAGE:$COMMIT_TAG -t $BACKEND_IMAGE:latest ./backend
      echo "🔍 Built images:"
      docker images | grep "$BACKEND_IMAGE"
      echo "✅ Backend image built"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 15 minutes

build_db_image:
  stage: build
  <<: *docker_template
  script:
    - |
      echo "🏗️ Building Database image..."
      echo "📂 Vérification du contexte de build..."

      # Vérifier le répertoire courant
      pwd
      ls -la

      # Vérifier le dossier db
      echo "📂 Vérification du dossier db..."
      if [ ! -d "db" ]; then
        echo "❌ ERREUR: Le dossier 'db' n'existe pas!"
        exit 1
      fi

      cd db
      echo "📂 Contenu du dossier db:"
      ls -la

      # Vérifier que le fichier schema.sql existe (versionné)
      if [ ! -f "schema.sql" ]; then
        echo "❌ ERREUR: Le fichier schema.sql n'existe pas dans db/. Il doit être versionné."
        exit 1
      fi

      # Gestion du fichier confidentiel
      echo "🔒 Gestion des données confidentielles..."
      if [ "$CI_COMMIT_REF_NAME" = "main" ] && [ -f "${EMPLOYEEDB_DUMP_FILE}" ]; then
        echo "📦 Utilisation du dump confidentiel pour la production..."
        cp "${EMPLOYEEDB_DUMP_FILE}" employeedb_dump.sql
        echo "✅ Fichier confidentiel copié (taille: $(wc -l < employeedb_dump.sql) lignes)"
      elif [ "$CI_COMMIT_REF_NAME" = "dev" ]; then
        echo "🛠️ Mode développement : création d'un fichier de données de test..."
        cat > employeedb_dump.sql << 'EOF'
      -- Development test data for EMS Platform
      -- This is NOT the real confidential data
      -- Real data is only used in production builds

      -- Create test tables if needed
      SELECT 'Development database initialized with test data';

      -- Add minimal test data for development
      INSERT INTO users (email, name) VALUES
        ('test@example.com', 'Test User'),
        ('dev@example.com', 'Development User');
      EOF
        echo "✅ Données de test créées pour le développement"
      else
        echo "⚠️ Aucun fichier de données fourni, base de données vide"
        echo "" > employeedb_dump.sql
      fi

      # Retour au répertoire parent pour le build
      cd ..

      echo "🔨 Construction de l'image Docker..."
      docker build \
        -t $DB_IMAGE:$COMMIT_TAG \
        -t $DB_IMAGE:latest \
        ./db

      echo "🔍 Images construites:"
      docker images | grep "$DB_IMAGE"

      echo "✅ Database image built successfully"

      # Nettoyer le fichier temporaire s'il existe
      if [ -f "db/employeedb_dump.sql" ]; then
        rm db/employeedb_dump.sql
        echo "🧹 Fichier temporaire nettoyé"
      fi
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 10 minutes

# === IMAGE_SCAN STAGE ===
trivy_scan_frontend:
  stage: image_scan
  <<: *trivy_template
  dependencies:
    - build_frontend_image
  script:
    - |
      echo "🔍 Scanning Frontend image with Trivy..."
      mkdir -p artifacts
      trivy image --format json --output artifacts/trivy-frontend-scan.json $FRONTEND_IMAGE:$COMMIT_TAG || true
      trivy image --format table --output artifacts/trivy-frontend-scan.txt $FRONTEND_IMAGE:$COMMIT_TAG || true
      echo "✅ Frontend image scan completed"
  artifacts:
    paths:
      - artifacts/trivy-frontend-scan.json
      - artifacts/trivy-frontend-scan.txt
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

trivy_scan_backend:
  stage: image_scan
  <<: *trivy_template
  dependencies:
    - build_backend_image
  script:
    - |
      echo "🔍 Scanning Backend image with Trivy..."
      mkdir -p artifacts
      trivy image --format json --output artifacts/trivy-backend-scan.json $BACKEND_IMAGE:$COMMIT_TAG || true
      trivy image --format table --output artifacts/trivy-backend-scan.txt $BACKEND_IMAGE:$COMMIT_TAG || true
      echo "✅ Backend image scan completed"
  artifacts:
    paths:
      - artifacts/trivy-backend-scan.json
      - artifacts/trivy-backend-scan.txt
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

trivy_scan_db:
  stage: image_scan
  <<: *trivy_template
  dependencies:
    - build_db_image
  script:
    - |
      echo "🔍 Scanning Database image with Trivy..."
      mkdir -p artifacts
      trivy image --format json --output artifacts/trivy-db-scan.json $DB_IMAGE:$COMMIT_TAG || true
      trivy image --format table --output artifacts/trivy-db-scan.txt $DB_IMAGE:$COMMIT_TAG || true
      echo "✅ Database image scan completed"
  artifacts:
    paths:
      - artifacts/trivy-db-scan.json
      - artifacts/trivy-db-scan.txt
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true

# === INFRASTRUCTURE STAGE ===
k8s_yaml_validation:
  stage: infrastructure
  image:
    name: alpine:latest
  before_script:
    - apk add --no-cache py3-pip
    - pip3 install yamllint --break-system-packages
  script:
    - echo "🔍 Vérification syntaxe YAML des manifests k8s/"
    - yamllint -c .yamllint k8s/ || (echo "❌ YAML mal formé !" && exit 1)
    - echo "✅ Validation YAML réussie"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true
  tags:
    - windows
    - docker
    - ems-platform

kube_linter:
  stage: infrastructure
  image:
    name: alpine:latest
  before_script:
    - echo "🔧 Installation kube-linter..."
    - apk add --no-cache curl tar
    - curl -L https://github.com/stackrox/kube-linter/releases/download/v0.6.8/kube-linter-linux.tar.gz -o kube-linter.tar.gz
    - tar -xzf kube-linter.tar.gz
    - chmod +x kube-linter
    - mv kube-linter /usr/local/bin/
    - kube-linter version
  script:
    - echo "🔍 Analyse kube-linter (best practices + sécurité)"
    - mkdir -p artifacts
    - kube-linter lint k8s/ --format sarif > artifacts/kube-linter-report.sarif || true
    - kube-linter lint k8s/ --format plain || true
    - echo "✅ Analyse kube-linter terminée"
  artifacts:
    paths:
      - artifacts/kube-linter-report.sarif
    expire_in: 1 week
    when: always
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  tags:
    - windows
    - docker
    - ems-platform

kubectl_dry_run:
  stage: infrastructure
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  before_script:
    - echo "🔧 Configuration kubectl..."
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_CONTENT" > ~/.kube/config
    - sed -i 's/127.0.0.1/host.docker.internal/g' ~/.kube/config
    - sed -i 's/localhost/host.docker.internal/g' ~/.kube/config
    - echo "🔍 Contexts disponibles:"
    - kubectl config get-contexts || true
    - echo "📌 Context actuel:"
    - kubectl config current-context || echo "Aucun context défini"
    - echo "📌 Tentative d'utilisation du context k3d-ems-platform-cluster..."
    - kubectl config use-context k3d-ems-platform-cluster || kubectl config use-context $(kubectl config get-contexts -o name | head -n 1) || echo "⚠️ Aucun context disponible"
  script:
    - echo "🚫 Simulation déploiement complet (dry-run)"
    - kubectl apply --dry-run=client --validate=false -f k8s/ --recursive || true
    - echo "✅ Dry-run terminé (validation désactivée car pas de connexion au cluster)"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true
  tags:
    - windows
    - docker
    - ems-platform

kubeconform_validate:
  stage: infrastructure
  image:
    name: alpine:latest
  before_script:
    - echo "🔧 Installation kubeconform..."
    - apk add --no-cache curl tar
    - curl -L https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
    - tar -xzf kubeconform.tar.gz
    - chmod +x kubeconform
    - mv kubeconform /usr/local/bin/
  script:
    - echo "🔍 Validation schéma officiel Kubernetes (kubeconform)"
    - kubeconform -schema-location default -ignore-missing-schemas -summary k8s/ || true
    - echo "✅ Validation kubeconform terminée"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  allow_failure: true
  tags:
    - windows
    - docker
    - ems-platform

# === DEPLOY STAGE - VERSION FINALE CORRIGÉE ===
deploy:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  script:
    - echo "🚀 Configuration de l'accès au cluster k3d..."
    - mkdir -p ~/.kube

    - echo "$KUBECONFIG_CONTENT" > ~/.kube/config

    - echo "🔍 Vérification de la configuration kubectl..."
    - kubectl config view --minify

    - echo "🔍 Test de connexion au cluster..."
    - kubectl cluster-info || (echo "❌ Impossible de se connecter au cluster!" && exit 1)

    - echo "✅ Connexion au cluster réussie!"
    - kubectl get nodes

    - echo "🔍 Vérification/Création du namespace ems-platform..."
    - kubectl get namespace ems-platform || kubectl create namespace ems-platform

    - echo "📦 Déploiement des ressources Kubernetes..."
    - kubectl apply -k k8s/_global/ || (echo "❌ Échec du déploiement!" && exit 1)

    - echo "⏳ Attente du démarrage des pods (timeout 3min)..."
    - kubectl wait --for=condition=ready pod -l app=frontend -n ems-platform --timeout=180s || echo "⚠️ Frontend pas encore prêt"
    - kubectl wait --for=condition=ready pod -l app=backend -n ems-platform --timeout=180s || echo "⚠️ Backend pas encore prêt"

    - echo "🎯 État des déploiements:"
    - kubectl get deployments -n ems-platform

    - echo "📊 État des pods:"
    - kubectl get pods -n ems-platform -o wide

    - echo "🔗 Services exposés:"
    - kubectl get svc -n ems-platform

    - echo "🌐 Ingress configurés:"
    - kubectl get ingress -n ems-platform || echo "Aucun ingress trouvé"

    - echo "✅ Déploiement terminé!"
    - echo "🌍 Application accessible via $NGROK_URL"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev"'
  allow_failure: false
  timeout: 10 minutes
  tags:
    - windows
    - docker
    - ems-platform

# === FINALIZE STAGE ===
push_images:
  stage: finalize
  <<: *docker_template
  dependencies:
    - trivy_scan_frontend
    - trivy_scan_backend
    - trivy_scan_db
  script:
    - |
      echo "🚀 Pushing images to Docker Hub..."
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        echo "📦 Pushing Frontend image..."
        docker push $FRONTEND_IMAGE:$COMMIT_TAG
        docker push $FRONTEND_IMAGE:latest

        echo "📦 Pushing Backend image..."
        docker push $BACKEND_IMAGE:$COMMIT_TAG
        docker push $BACKEND_IMAGE:latest

        echo "📦 Pushing Database image..."
        docker push $DB_IMAGE:$COMMIT_TAG
        docker push $DB_IMAGE:latest

        echo "✅ All images pushed successfully"
      elif [ "$CI_COMMIT_REF_NAME" = "dev" ]; then
        echo "📦 Pushing dev images..."
        docker push $FRONTEND_IMAGE:$COMMIT_TAG
        docker push $BACKEND_IMAGE:$COMMIT_TAG
        docker push $DB_IMAGE:$COMMIT_TAG
        echo "✅ Dev images pushed successfully"
      fi
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "main"'
  timeout: 15 minutes
  tags:
    - windows
    - docker
    - ems-platform

notify_success:
  stage: finalize
  image: alpine:latest
  script:
    - |
      echo "🎉 Pipeline completed successfully!"
      echo "📊 Summary:"
      echo "- Setup: ✅ Dependencies installed"
      echo "- Quality: ✅ ESLint & Prettier checks"
      echo "- Security: ✅ Audit, Prisma validation & Trivy scans"
      echo "- Tests: ✅ Frontend & Backend tests"
      echo "- Analysis: ✅ SonarQube analysis"
      echo "- Build: ✅ 3 Docker images built"
      echo "- Image Scan: ✅ Trivy image scans"
      echo "- Infrastructure: ⚠️ Ready for implementation"
      echo "- Deploy: ⚠️ Ready for implementation"
      echo "- Finalize: ✅ Images pushed"

      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        echo "🚀 Production images pushed to Docker Hub"
        echo "📦 Available images:"
        echo "  - $FRONTEND_IMAGE:latest"
        echo "  - $BACKEND_IMAGE:latest"
        echo "  - $DB_IMAGE:latest"
      elif [ "$CI_COMMIT_REF_NAME" = "dev" ]; then
        echo "🛠️ Development images tagged with commit SHA"
        echo "📦 Available images:"
        echo "  - $FRONTEND_IMAGE:$COMMIT_TAG"
        echo "  - $BACKEND_IMAGE:$COMMIT_TAG"
        echo "  - $DB_IMAGE:$COMMIT_TAG"
      fi

      echo ""
      echo "📈 SonarQube Reports:"
      if [ -n "${SONAR_HOST_URL:-}" ] && [ -n "${SONAR_TOKEN:-}" ]; then
        echo "  - Frontend: ${SONAR_HOST_URL}/dashboard?id=ems-platform-frontend"
        echo "  - Backend: ${SONAR_HOST_URL}/dashboard?id=ems-platform-backend"
      else
        echo "  ⚠️ SonarQube not configured for local runner"
      fi

      echo "⏱️ Pipeline completed at: $(date)"
  when: on_success
  tags:
    - windows
    - docker
    - ems-platform

cleanup:
  stage: finalize
  <<: *docker_template
  script:
    - |
      echo "🧹 Pipeline cleanup..."
      echo "🔍 Docker system info:"
      docker system df
      echo "🔄 Pruning unused containers, networks, and images..."
      docker system prune -f
      echo "✅ Cleanup completed"
  when: always
  allow_failure: true
  timeout: 5 minutes

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
