apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ems-ngrok
  namespace: ems-platform
  annotations:
    ngrok.com/global-tunnel: "true"
spec:
  ingressClassName: ngrok
  rules:
    - host: nonentomologic-spring-conflictedly.ngrok-free.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
